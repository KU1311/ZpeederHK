<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商場室內 PDR 軌跡與店舖標記工具</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 12px; background: #f2f2f7; color: #1c1c1e; }
    h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }
    
    .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    label { font-size: 12px; color: #666; font-weight: bold; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    button { width: 100%; padding: 10px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; background: #007aff; color: white; cursor: pointer; transition: 0.2s; }
    button:disabled { background: #b0b0b8; cursor: not-allowed; }
    button.secondary { background: #34c759; }
    button.danger { background: #ff3b30; }
    button.warning { background: #ff9500; }
    button.small { padding: 4px 8px; font-size: 12px; width: auto; }
    
    #canvas-container { width: 100%; height: 320px; background: #1c1c1e; border-radius: 12px; position: relative; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    
    .status-bar { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 6px; }
    
    .store-list { max-height: 250px; overflow-y: auto; margin-top: 8px; }
    .store-item { background: #f8f9fa; border: 1px solid #e5e5ea; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
    .store-item header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; }
    .store-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
    .modal-content { background: white; border-radius: 12px; padding: 16px; width: 90%; max-width: 400px; }
  </style>
</head>
<body>

  <h2>🏬 商場室內軌跡標記工具</h2>

  <!-- 1. 基本設定與樓層控制 -->
  <div class="card">
    <div class="grid-2" style="margin-bottom: 8px;">
      <div>
        <label>商場名稱 <span style="color:red;">*</span></label>
        <input type="text" id="mallName" placeholder="請先輸入商場名稱">
      </div>
      <div>
        <label>當前樓層</label>
        <select id="floorSelect">
          <option value="B2">B2 樓</option>
          <option value="B1">B1 樓</option>
          <option value="G" selected>G 樓</option>
          <option value="L1">L1 樓</option>
          <option value="L2">L2 樓</option>
          <option value="L3">L3 樓</option>
          <option value="L4">L4 樓</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <button id="btnGps">1. 抓取 GPS 起點</button>
      <button id="btnStartPdr" disabled class="secondary">2. 開始 PDR 行走</button>
    </div>
  </div>

  <!-- 2. 地圖軌跡 Canvas -->
  <div class="card" style="padding: 8px;">
    <div id="canvas-container">
      <canvas id="mapCanvas"></canvas>
    </div>
    <div class="status-bar">
      <span>步數: <strong id="valSteps">0</strong></span>
      <span>航向: <strong id="valHeading">0</strong>°</span>
      <span>樓層軌跡點: <strong id="valPoints">0</strong></span>
    </div>
    <div class="grid-2" style="margin-top: 8px;">
      <button id="btnAddStore" disabled class="warning">＋ 新增店舖標記</button>
      <button id="btnExportCsv" class="secondary">📥 匯出 CSV 檔</button>
    </div>
  </div>

  <!-- 3. 已記錄店舖清單 -->
  <div class="card">
    <label>已記錄商舖清單 (<span id="storeCount">0</span>)</label>
    <div class="store-list" id="storeListContainer">
      <div style="text-align: center; color: #999; padding: 20px;">暫無店舖記錄，請點擊「新增店舖標記」</div>
    </div>
  </div>

  <!-- 店舖資料 Modal -->
  <div class="modal" id="storeModal">
    <div class="modal-content">
      <h3 style="margin-top:0;">輸入店舖資料</h3>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div>
          <label>中文名稱</label>
          <input type="text" id="inputNameCn" placeholder="例: 喜茶">
        </div>
        <div>
          <label>英文名稱</label>
          <input type="text" id="inputNameEn" placeholder="例: HEYTEA">
        </div>
        <div>
          <label>鋪號 (Shop No.)</label>
          <input type="text" id="inputShopNo" placeholder="例: L1-01">
        </div>
        <div>
          <label>備註 (Remark)</label>
          <input type="text" id="inputRemark
