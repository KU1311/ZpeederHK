<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商場室內 PDR 軌跡標記工具</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 12px; background: #f2f2f7; color: #1c1c1e; }
    h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }
    
    .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    
    label { font-size: 12px; color: #666; font-weight: bold; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }
    input:disabled, select:disabled { background: #e5e5ea; color: #8e8e93; }
    
    button { width: 100%; padding: 12px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; background: #007aff; color: white; cursor: pointer; }
    button:disabled { background: #b0b0b8; opacity: 0.6; cursor: not-allowed; }
    button.secondary { background: #34c759; }
    button.danger { background: #ff3b30; }
    button.warning { background: #ff9500; }
    button.small { padding: 6px 10px; font-size: 12px; width: auto; }
    
    /* 打點按鈕專用樣式 */
    .quick-add-btn { background: #ff9500; color: white; padding: 10px 4px; font-size: 12px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; text-align: center; }
    .quick-add-btn:disabled { background: #b0b0b8; opacity: 0.6; cursor: not-allowed; }

    #canvas-container { width: 100%; height: 320px; background: #1c1c1e; border-radius: 12px; position: relative; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }

    .control-btn-group { position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 6px; }
    .overlay-btn { background: rgba(0, 122, 255, 0.85); color: white; padding: 6px 12px; font-size: 12px; border-radius: 20px; border: none; font-weight: bold; backdrop-filter: blur(4px); cursor: pointer; }
    
    .post-panel { display: none; background: #eef6ff; border: 1px solid #007aff; border-radius: 8px; padding: 10px; margin-top: 8px; }
    .post-panel label { color: #007aff; font-size: 12px; }
    .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .slider-row input[type=range] { flex: 1; }

    .status-bar { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1.2fr; gap: 4px; font-size: 11px; color: #666; margin-top: 6px; text-align: center; }
    .status-bar div { background: #e5e5ea; padding: 4px; border-radius: 4px; }
    
    .store-list { max-height: 220px; overflow-y: auto; margin-top: 8px; }
    .store-item { background: #f8f9fa; border: 1px solid #e5e5ea; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
    .store-item:active { background: #e5e5ea; }
    .store-item header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
    .modal-content { background: white; border-radius: 12px; padding: 16px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

  <h2>🏬 商場室內軌跡標記工具</h2>

  <div class="card">
    <div class="grid-2" style="margin-bottom: 8px;">
      <div>
        <label>商場名稱 <span style="color:red;">*</span></label>
        <input type="text" id="mallName" placeholder="請先輸入商場名稱">
      </div>
      <div>
        <label>當前樓層 (手動輸入)</label>
        <input type="text" id="floorInput" value="G" placeholder="例: G, L1, B2">
      </div>
    </div>

    <div class="grid-2" style="margin-bottom: 8px;">
      <div>
        <label>商場走廊大小：</label>
        <select id="corridorSizeSelect">
          <option value="2" selected>🚶 小型通道 (2m)</option>
          <option value="4">🏃 大型通道 (4m)</option>
        </select>
      </div>

      <div>
        <label>步長推進靈敏度：</label>
        <select id="stepKSelect">
          <option value="0.38">🐢 偏慢 (系統走太快時選這)</option>
          <option value="0.45" selected>🚶 標準 (預設)</option>
          <option value="0.52">🐇 偏快 (系統走太慢時選這)</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <button id="btnGps" type="button">1. 抓取 GPS 起點</button>
      <button id="btnStartPdr" type="button" class="secondary">2. 開始 PDR 行走</button>
    </div>
  </div>

  <div class="card" style="padding: 8px;">
    <div id="canvas-container">
      <div class="control-btn-group">
        <button class="overlay-btn" id="btnToggleOsm" type="button">🗺️ 關閉底圖</button>
        <button class="overlay-btn" id="btnResetView" type="button">🎯 重置視角</button>
      </div>
      <canvas id="mapCanvas"></canvas>
    </div>

    <!-- 後處理調整控制板 -->
    <div class="post-panel" id="postPanel">
      <div style="font-weight: bold; font-size: 13px; color: #007aff; margin-bottom: 6px;">🛠️ 後處理調整：</div>
      <div class="slider-row">
        <label>整體旋轉：</label>
        <input type="range" id="rotSlider" min="-360" max="360" value="0">
        <span id="rotValue" style="font-size: 12px; width: 50px; font-weight: bold;">0°</span>
      </div>
      <div class="slider-row">
        <label>整體縮放：</label>
        <input type="range" id="scaleSlider" min="20" max="400" value="100">
        <span id="scaleValue" style="font-size: 12px; width: 50px; font-weight: bold;">100%</span>
      </div>
      <div class="slider-row">
        <label>X軸平移(東西):</label>
        <input type="range" id="offXSlider" min="-100" max="100" value="0" step="0.5">
        <span id="offXValue" style="font-size: 12px; width: 50px; font-weight: bold;">0m</span>
      </div>
      <div class="slider-row">
        <label>Y軸平移(南北):</label>
        <input type="range" id="offYSlider" min="-100" max="100" value="0" step="0.5">
        <span id="offYValue" style="font-size: 12px; width: 50px; font-weight: bold;">0m</span>
      </div>
      <button class="small" id="btnResetPost" type="button" style="background:#007aff;">重置後處理設定</button>
    </div>

    <!-- Debug 監控列 -->
    <div class="status-bar">
      <div>步數: <strong id="valSteps">0</strong></div>
      <div>距離: <strong id="valDistance" style="color:#007aff;">0.0</strong>m</div>
      <div>即時步長: <strong id="valCurrentStepLen" style="color:#34c759;">0.00</strong>m</div>
      <div>航向: <strong id="valHeading">0</strong>°</div>
      <div>點數: <strong id="valPoints">0</strong></div>
    </div>
    
    <!-- 2 行 6 個按鈕快抓標記 -->
    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
      <label style="margin-bottom: 2px;">新增店舖標記 (點擊選擇方向並填寫資料)：</label>
      <!-- 第一行：預先向前方打點 -->
      <div class="grid-3">
        <button type="button" class="quick-add-btn" id="btnAddLf" disabled onclick="quickAddStore('left_front')">👈 左前 (+4m)</button>
        <button type="button" class="quick-add-btn" id="btnAddF6" disabled onclick="quickAddStore('front_6m')">🎯 正前 (+6m)</button>
        <button type="button" class="quick-add-btn" id="btnAddRf" disabled onclick="quickAddStore('right_front')">👉 右前 (+4m)</button>
      </div>
      <!-- 第二行：當前平行位置打點 -->
      <div class="grid-3">
        <button type="button" class="quick-add-btn" id="btnAddL" disabled onclick="quickAddStore('left')">👈 左</button>
        <button type="button" class="quick-add-btn" id="btnAddC" disabled onclick="quickAddStore('front')">🎯 正前</button>
        <button type="button" class="quick-add-btn" id="btnAddR" disabled onclick="quickAddStore('right')">👉 右</button>
      </div>
      
      <button id="btnExportCsv" type="button" class="secondary" style="margin-top: 4px;">📥 匯出 CSV 與 QGIS 軌跡(GPX)</button>
    </div>
  </div>

  <div class="card">
    <label>已記錄商舖清單 (點擊可修改詳細資料) (<span id="storeCount">0</span>)</label>
    <div class="store-list" id="storeListContainer">
      <div style="text-align: center; color: #999; padding: 15px;">暫無店舖記錄</div>
    </div>
  </div>

  <!-- 店舖資料 Modal (新增/編輯 Popup) -->
  <div class="modal" id="storeModal">
    <div class="modal-content">
      <h3 style="margin-top:0; margin-bottom: 10px;" id="modalTitle">新增店舖標記</h3>
      
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <button id="btnSaveStore" type="button" style="flex:1;">儲存標記</button>
        <button id="btnDeleteStore" type="button" class="danger" style="flex:1; display:none;">🗑️ 刪除標記</button>
        <button id="btnCancelStore" type="button" class="danger" style="flex:1; background:#8e8e93;">取消</button>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <div>
          <label>鋪號 (Shop No.) <span style="color:#007aff;">(第一圈快速填寫)</span></label>
          <input type="text" id="inputShopNo" placeholder="例: L1-01">
        </div>
        <div>
          <label>中文名稱</label>
          <input type="text" id="inputNameCn" placeholder="例: 喜茶">
        </div>
        <div>
          <label>英文名稱</label>
          <input type="text" id="inputNameEn" placeholder="例: HEYTEA">
        </div>

        <div>
          <label>店鋪類別</label>
          <select id="selectCategory">
            <option value="">-- 請選擇類別 (留空) --</option>
            <option value="購物">購物</option>
            <option value="餐廳">餐廳</option>
            <option value="交通運輸">交通運輸</option>
            <option value="美容及個人服務">美容及個人服務</option>
            <option value="銀行及金融服務">銀行及金融服務</option>
            <option value="旅遊">旅遊</option>
            <option value="通訊">通訊</option>
            <option value="地產">地產</option>
            <option value="裝修">裝修</option>
            <option value="教育">教育</option>
            <option value="體育運動">體育運動</option>
            <option value="醫療">醫療</option>
            <option value="宗教及拜祭">宗教及拜祭</option>
            <option value="社會服務">社會服務</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div id="subCategoryGroup" style="display: none;">
          <label>購物子類別</label>
          <select id="selectSubCategory">
            <option value="">-- 請選擇子類別 (留空) --</option>
            <option value="食品、超市與日用品">食品、超市與日用品</option>
            <option value="時裝、鞋包與飾品">時裝、鞋包與飾品</option>
            <option value="美妝、母嬰與個人護理">美妝、母嬰與個人護理</option>
            <option value="專門興趣、文化與休閒">專門興趣、文化與休閒</option>
            <option value="運動、戶外與寵物/水族">運動、戶外與寵物/水族</option>
            <option value="電器、電子與視聽">電器、電子與視聽</option>
            <option value="家居、生活用品與修繕">家居、生活用品與修繕</option>
            <option value="車輛及零件銷售">車輛及零件銷售</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div>
          <label>備註 (Remark)</label>
          <input type="text" id="inputRemark" placeholder="例: 近扶手梯">
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let startGps = { lat: 22.3193, lng: 114.1694 };
      let isPdrRunning = false;
      let startTimestampStr = ''; 
      let showOsmMap = true;
      
      let currentX = 0;
      let currentY = 0;
      let currentHeading = 0;
      let stepCount = 0;
      let totalDistanceMeters = 0;
      let lastStepLength = 0.65;
      
      let pathHistory = [];
      let stores = [];
      let pendingStoreObj = null;
      let editingStoreId = null;

      // 後處理參數
      let postRotationDeg = 0;
      let postScaleRatio = 1.0;
      let postOffsetX = 0;
      let postOffsetY = 0;

      const tileCache = {};

      let panX = 0;
      let panY = 0;
      let zoomFactor = 1.0;
      let isDragging = false;
      let startMouseX = 0, startMouseY = 0;
      let initialPinchDist = null;

      const canvas = document.getElementById('mapCanvas');
      const ctx = canvas ? canvas.getContext('2d') : null;

      const selectCategory = document.getElementById('selectCategory');
      const selectSubCategory = document.getElementById('selectSubCategory');
      const subCategoryGroup = document.getElementById('subCategoryGroup');

      selectCategory.onchange = function() {
        if (this.value === '購物') {
          subCategoryGroup.style.display = 'block';
        } else {
          subCategoryGroup.style.display = 'none';
          selectSubCategory.value = '';
        }
      };

      function getCurrentFloor() {
        let f = document.getElementById('floorInput').value.trim();
        return f ? f : 'G';
      }

      function getCorridorOffsetDist() {
        return parseFloat(document.getElementById('corridorSizeSelect').value) || 2.0;
      }

      function getWeinbergK() {
        return parseFloat(document.getElementById('stepKSelect').value) || 0.45;
      }

      function resizeCanvas() {
        if (!canvas) return;
        canvas.width = canvas.offsetWidth || 300;
        canvas.height = canvas.offsetHeight || 320;
        drawMap();
      }

      function ensureMallName() {
        let mallInput = document.getElementById('mallName');
        let name = mallInput.value.trim();
        if (!name) {
          alert('⚠️ 請先輸入「商場名稱」！');
          mallInput.focus();
          return false;
        }
        return true;
      }

      function generateTimestamp() {
        let now = new Date();
        let YYYY = now.getFullYear();
        let MM = String(now.getMonth() + 1).padStart(2, '0');
        let DD = String(now.getDate()).padStart(2, '0');
        let hh = String(now.getHours()).padStart(2, '0');
        let mm = String(now.getMinutes()).padStart(2, '0');
        return `${YYYY}${MM}${DD}_${hh}${mm}`;
      }

      function resetView() {
        panX = 0;
        panY = 0;
        zoomFactor = 1.0;
        drawMap();
      }
      document.getElementById('btnResetView').onclick = resetView;

      const btnToggleOsm = document.getElementById('btnToggleOsm');
      btnToggleOsm.onclick = function() {
        showOsmMap = !showOsmMap;
        btnToggleOsm.innerText = showOsmMap ? '🗺️ 關閉底圖' : '🗺️ 開啟底圖';
        drawMap();
      };

      // 1. GPS 定位
      document.getElementById('btnGps').onclick = function() {
        if (!ensureMallName()) return;

        showOsmMap = true;
        btnToggleOsm.innerText = '🗺️ 關閉底圖';

        if (!navigator.geolocation) {
          alert('此瀏覽器不支援 GPS');
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function(pos) {
            startGps.lat = pos.coords.latitude;
            startGps.lng = pos.coords.longitude;
            alert(`✅ GPS 定位成功！\nLat: ${startGps.lat.toFixed(6)}, Lng: ${startGps.lng.toFixed(6)}`);
            document.getElementById('btnGps').innerText = '✓ GPS 已定位';
            document.getElementById('btnGps').style.background = '#34c759';
            resetView();
          },
          function(err) {
            alert('⚠️ GPS 定位失敗/超時，使用預設起點 (0,0)');
            document.getElementById('btnGps').innerText = '使用預設起點';
            resetView();
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      };

      // 2. Weinberg 動態步長演算法
      const STEP_THRESHOLD = 2.2;
      const MIN_STEP_INTERVAL = 280;
      let lastStepTime = 0;

      let currentStepAccMax = -Infinity;
      let currentStepAccMin = Infinity;

      function handleOrientation(e) {
        if (e.alpha !== null) {
          currentHeading = e.webkitCompassHeading || (360 - e.alpha);
          document.getElementById('valHeading').innerText = Math.round(currentHeading);
        }
      }

      function handleMotion(e) {
        let acc = e.accelerationIncludingGravity;
        if (!acc) return;

        let mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        let delta = Math.abs(mag - 9.8);
        let now = Date.now();

        if (mag > currentStepAccMax) currentStepAccMax = mag;
        if (mag < currentStepAccMin) currentStepAccMin = mag;

        if (delta > STEP_THRESHOLD && (now - lastStepTime > MIN_STEP_INTERVAL)) {
          lastStepTime = now;
          stepCount++;

          let K = getWeinbergK();
          let deltaAcc = Math.max(0.1, currentStepAccMax - currentStepAccMin);
          let dynamicStepLength = K * Math.pow(deltaAcc, 0.25);

          dynamicStepLength = Math.min(Math.max(dynamicStepLength, 0.30), 1.00);
          lastStepLength = dynamicStepLength;
          totalDistanceMeters += dynamicStepLength;

          currentStepAccMax = -Infinity;
          currentStepAccMin = Infinity;

          document.getElementById('valSteps').innerText = stepCount;
          document.getElementById('valDistance').innerText = totalDistanceMeters.toFixed(1);
          document.getElementById('valCurrentStepLen').innerText = dynamicStepLength.toFixed(2);

          let rad = (currentHeading * Math.PI) / 180;
          currentX += dynamicStepLength * Math.sin(rad);
          currentY += dynamicStepLength * Math.cos(rad);

          pathHistory.push({
            floor: getCurrentFloor(),
            x: currentX,
            y: currentY,
            timestamp: new Date().toISOString()
          });

          document.getElementById('valPoints').innerText = pathHistory.filter(p => p.floor === getCurrentFloor()).length;
          drawMap();
        }
      }

      function setConfigLock(locked) {
        document.getElementById('mallName').disabled = locked;
        document.getElementById('floorInput').disabled = locked;
        document.getElementById('corridorSizeSelect').disabled = locked;
        document.getElementById('stepKSelect').disabled = locked;
        document.getElementById('btnGps').disabled = locked;

        ['btnAddLf', 'btnAddF6', 'btnAddRf', 'btnAddL', 'btnAddC', 'btnAddR'].forEach(id => {
          document.getElementById(id).disabled = !locked;
        });
      }

      document.getElementById('btnStartPdr').onclick = async function() {
        const btn = document.getElementById('btnStartPdr');

        if (isPdrRunning) {
          window.removeEventListener('deviceorientation', handleOrientation);
          window.removeEventListener('devicemotion', handleMotion);
          isPdrRunning = false;
          btn.innerText = '2. 開始 PDR 行走';
          btn.className = 'secondary';
          
          setConfigLock(false);
          document.getElementById('postPanel').style.display = 'block';
          alert('⏹️ PDR 記錄已停止！欄位已解鎖。');
          return;
        }

        if (!ensureMallName()) return;

        try {
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const perm = await DeviceOrientationEvent.requestPermission();
            if (perm !== 'granted') {
              alert('需要同意感應器權限才能記錄！');
              return;
            }
          }

          window.addEventListener('deviceorientation', handleOrientation);
          window.addEventListener('devicemotion', handleMotion);

          isPdrRunning = true;
          startTimestampStr = generateTimestamp();

          setConfigLock(true);

          showOsmMap = false;
          btnToggleOsm.innerText = '🗺️ 開啟底圖';
          document.getElementById('postPanel').style.display = 'none';

          btn.innerText = '⏹️ 停止 PDR 記錄';
          btn.className = 'danger';
          
          pathHistory.push({ 
            floor: getCurrentFloor(), 
            x: currentX, 
            y: currentY, 
            timestamp: new Date().toISOString() 
          });
          resizeCanvas();
          alert('🚀 PDR 記錄已啟動！請點擊按鈕進行快抓標記。');
        } catch (err) {
          alert('感應器啟動失敗: ' + err.message);
        }
      };

      document.getElementById('floorInput').onchange = function() {
        resetView();
        renderStoreList();
      };

      function transformPoint(x, y) {
        let rad = (postRotationDeg * Math.PI) / 180.0;
        let scaledX = x * postScaleRatio;
        let scaledY = y * postScaleRatio;

        let rx = scaledX * Math.cos(rad) - scaledY * Math.sin(rad);
        let ry = scaledX * Math.sin(rad) + scaledY * Math.cos(rad);

        return { 
          x: rx + postOffsetX, 
          y: ry + postOffsetY 
        };
      }

      const rotSlider = document.getElementById('rotSlider');
      const scaleSlider = document.getElementById('scaleSlider');
      const offXSlider = document.getElementById('offXSlider');
      const offYSlider = document.getElementById('offYSlider');

      rotSlider.oninput = function() {
        postRotationDeg = parseFloat(this.value);
        document.getElementById('rotValue').innerText = postRotationDeg + '°';
        drawMap();
        renderStoreList();
      };

      scaleSlider.oninput = function() {
        postScaleRatio = parseFloat(this.value) / 100.0;
        document.getElementById('scaleValue').innerText = this.value + '%';
        drawMap();
        renderStoreList();
      };

      offXSlider.oninput = function() {
        postOffsetX = parseFloat(this.value);
        document.getElementById('offXValue').innerText = postOffsetX + 'm';
        drawMap();
        renderStoreList();
      };

      offYSlider.oninput = function() {
        postOffsetY = parseFloat(this.value);
        document.getElementById('offYValue').innerText = postOffsetY + 'm';
        drawMap();
        renderStoreList();
      };

      document.getElementById('btnResetPost').onclick = function() {
        rotSlider.value = 0;
        scaleSlider.value = 100;
        offXSlider.value = 0;
        offYSlider.value = 0;

        postRotationDeg = 0;
        postScaleRatio = 1.0;
        postOffsetX = 0;
        postOffsetY = 0;

        document.getElementById('rotValue').innerText = '0°';
        document.getElementById('scaleValue').innerText = '100%';
        document.getElementById('offXValue').innerText = '0m';
        document.getElementById('offYValue').innerText = '0m';
        drawMap();
        renderStoreList();
      };

      function lon2tile(lon, zoom) { return Math.floor((lon + 180) / 360 * Math.pow(2, zoom)); }
      function lat2tile(lat, zoom) { return Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom)); }
      function tile2lon(x, z) { return (x / Math.pow(2, z) * 360 - 180); }
      function tile2lat(y, z) {
        let n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
        return (180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))));
      }

      function drawOsmTiles(centerLat, centerLng, zoom, scale, toCanvasX, toCanvasY) {
        let osmZoom = 18;
        let tileX = lon2tile(centerLng, osmZoom);
        let tileY = lat2tile(centerLat, osmZoom);

        for (let dx = -3; dx <= 3; dx++) {
          for (let dy = -3; dy <= 3; dy++) {
            let tx = tileX + dx;
            let ty = tileY + dy;
            let tileKey = `${osmZoom}_${tx}_${ty}`;

            let tNwLat = tile2lat(ty, osmZoom);
            let tNwLng = tile2lon(tx, osmZoom);
            let tSeLat = tile2lat(ty + 1, osmZoom);
            let tSeLng = tile2lon(tx + 1, osmZoom);

            let relX_nw = (tNwLng - centerLng) * (111000.0 * Math.cos(centerLat * Math.PI / 180.0));
            let relY_nw = (tNwLat - centerLat) * 111000.0;
            let relX_se = (tSeLng - centerLng) * (111000.0 * Math.cos(centerLat * Math.PI / 180.0));
            let relY_se = (tSeLat - centerLat) * 111000.0;

            let cX1 = toCanvasX(relX_nw);
            let cY1 = toCanvasY(relY_nw);
            let cX2 = toCanvasX(relX_se);
            let cY2 = toCanvasY(relY_se);

            if (!tileCache[tileKey]) {
              let img = new Image();
              img.crossOrigin = "Anonymous";
              img.src = `https://tile.openstreetmap.org/${osmZoom}/${tx}/${ty}.png`;
              img.onload = () => drawMap();
              tileCache[tileKey] = img;
            } else if (tileCache[tileKey].complete) {
              ctx.drawImage(tileCache[tileKey], cX1, cY1, cX2 - cX1, cY2 - cY1);
            }
          }
        }
      }

      // 3. Canvas 繪製
      function drawMap() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let cFloor = getCurrentFloor();
        const floorPaths = pathHistory.filter(p => p.floor === cFloor);
        const floorStores = stores.filter(s => s.floor === cFloor);

        let transformedPaths = floorPaths.map(p => {
          let tp = transformPoint(p.x, p.y);
          return { x: tp.x, y: tp.y };
        });

        let curTrans = transformPoint(currentX, currentY);

        let minX = curTrans.x, maxX = curTrans.x, minY = curTrans.y, maxY = curTrans.y;
        transformedPaths.forEach(p => {
          minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
          minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        });

        const padding = 40;
        const rangeX = (maxX - minX) || 10;
        const rangeY = (maxY - minY) || 10;
        const baseScale = Math.min((canvas.width - padding * 2) / rangeX, (canvas.height - padding * 2) / rangeY);
        const scale = baseScale * zoomFactor;

        function toCanvasX(x) { return (canvas.width / 2) + panX + (x - (minX + maxX) / 2) * scale; }
        function toCanvasY(y) { return (canvas.height / 2) + panY - (y - (minY + maxY) / 2) * scale; }

        if (showOsmMap && startGps.lat && startGps.lng) {
          ctx.fillStyle = '#e0e0e0';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          drawOsmTiles(startGps.lat, startGps.lng, zoomFactor, scale, toCanvasX, toCanvasY);
        } else {
          ctx.fillStyle = '#1c1c1e';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.strokeStyle = '#2c2c2e';
          ctx.lineWidth = 1;
          let gridSize = 30 * zoomFactor;
          let startGridX = (panX % gridSize);
          let startGridY = (panY % gridSize);

          for (let x = startGridX; x < canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
          for (let y = startGridY; y < canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
        }

        if (transformedPaths.length > 1) {
          ctx.beginPath();
          ctx.strokeStyle = '#007aff';
          ctx.lineWidth = Math.max(2, 4 * zoomFactor);
          ctx.lineJoin = 'round';
          transformedPaths.forEach((pt, i) => {
            let cx = toCanvasX(pt.x);
            let cy = toCanvasY(pt.y);
            if (i === 0) ctx.moveTo(cx, cy);
            else ctx.lineTo(cx, cy);
          });
          ctx.stroke();
        }

        floorStores.forEach(s => {
          let transStore = transformPoint(s.finalX, s.finalY);
          let sx = toCanvasX(transStore.x);
          let sy = toCanvasY(transStore.y);

          ctx.fillStyle = '#ff9500';
          ctx.beginPath(); ctx.arc(sx, sy, Math.max(4, 6 * zoomFactor), 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();

          ctx.fillStyle = showOsmMap ? '#000000' : '#ffffff';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(`${s.shopNo} ${s.nameCn || s.nameEn}`, sx + 8, sy + 4);
        });

        let curCX = toCanvasX(curTrans.x);
        let curCY = toCanvasY(curTrans.y);
        ctx.fillStyle = '#34c759';
        ctx.beginPath(); ctx.arc(curCX, curCY, Math.max(6, 8 * zoomFactor), 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
      }

      // 手勢平移與縮放
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        startMouseX = e.clientX - panX;
        startMouseY = e.clientY - panY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startMouseX;
        panY = e.clientY - startMouseY;
        drawMap();
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) zoomFactor *= 1.1;
        else zoomFactor /= 1.1;
        zoomFactor = Math.min(Math.max(0.1, zoomFactor), 15.0);
        drawMap();
      }, { passive: false });

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startMouseX = e.touches[0].clientX - panX;
          startMouseY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) {
          isDragging = false;
          initialPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      });

      canvas.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          panX = e.touches[0].clientX - startMouseX;
          panY = e.touches[0].clientY - startMouseY;
          drawMap();
        } else if (e.touches.length === 2 && initialPinchDist) {
          let dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          let factor = dist / initialPinchDist;
          zoomFactor *= factor;
          zoomFactor = Math.min(Math.max(0.1, zoomFactor), 15.0);
          initialPinchDist = dist;
          drawMap();
        }
      });

      canvas.addEventListener('touchend', () => {
        isDragging = false;
        initialPinchDist = null;
      });

      // 點擊 6 個按鈕快抓打點
      const modal = document.getElementById('storeModal');
      const btnDeleteStore = document.getElementById('btnDeleteStore');

      window.quickAddStore = function(mode) {
        if (!isPdrRunning) return;

        editingStoreId = null;
        let corridorDist = getCorridorOffsetDist();

        pendingStoreObj = {
          id: 'store_' + Date.now(),
          mall: document.getElementById('mallName').value,
          floor: getCurrentFloor(),
          nameCn: '',
          nameEn: '',
          shopNo: '',
          category: '',
          subCategory: '',
          remark: '',
          rawX: currentX,
          rawY: currentY,
          heading: currentHeading,
          side: mode,
          offsetDist: corridorDist,
          finalX: 0,
          finalY: 0
        };

        // 幾何座標計算
        let radHeading = (currentHeading * Math.PI) / 180.0;
        let radLeft = ((currentHeading - 90) * Math.PI) / 180.0;
        let radRight = ((currentHeading + 90) * Math.PI) / 180.0;

        let fx = currentX;
        let fy = currentY;

        if (mode === 'left') {
          fx += corridorDist * Math.sin(radLeft);
          fy += corridorDist * Math.cos(radLeft);
        } else if (mode === 'right') {
          fx += corridorDist * Math.sin(radRight);
          fy += corridorDist * Math.cos(radRight);
        } else if (mode === 'front') {
          fx += corridorDist * Math.sin(radHeading);
          fy += corridorDist * Math.cos(radHeading);
        } else if (mode === 'left_front') {
          fx += corridorDist * Math.sin(radLeft) + 4.0 * Math.sin(radHeading);
          fy += corridorDist * Math.cos(radLeft) + 4.0 * Math.cos(radHeading);
        } else if (mode === 'right_front') {
          fx += corridorDist * Math.sin(radRight) + 4.0 * Math.sin(radHeading);
          fy += corridorDist * Math.cos(radRight) + 4.0 * Math.cos(radHeading);
        } else if (mode === 'front_6m') {
          fx += 6.0 * Math.sin(radHeading);
          fy += 6.0 * Math.cos(radHeading);
        }

        pendingStoreObj.finalX = fx;
        pendingStoreObj.finalY = fy;

        // 清空表單並彈出 Modal
        document.getElementById('modalTitle').innerText = `新增店舖標記 [${mode.toUpperCase()}]`;
        btnDeleteStore.style.display = 'none';

        document.getElementById('inputShopNo').value = '';
        document.getElementById('inputNameCn').value = '';
        document.getElementById('inputNameEn').value = '';
        selectCategory.value = '';
        selectSubCategory.value = '';
        subCategoryGroup.style.display = 'none';
        document.getElementById('inputRemark').value = '';

        modal.style.display = 'flex';
      };

      // 點擊清單項目進行編輯
      window.editStore = function(storeId) {
        let store = stores.find(s => s.id === storeId);
        if (!store) return;

        editingStoreId = storeId;
        pendingStoreObj = null;

        document.getElementById('modalTitle').innerText = `編輯店舖 [${store.shopNo || '未命名'}]`;
        btnDeleteStore.style.display = 'block';

        document.getElementById('inputShopNo').value = store.shopNo || '';
        document.getElementById('inputNameCn').value = store.nameCn || '';
        document.getElementById('inputNameEn').value = store.nameEn || '';
        
        selectCategory.value = store.category || '';
        if (store.category === '購物') {
          subCategoryGroup.style.display = 'block';
          selectSubCategory.value = store.subCategory || '';
        } else {
          subCategoryGroup.style.display = 'none';
          selectSubCategory.value = '';
        }

        document.getElementById('inputRemark').value = store.remark || '';
        modal.style.display = 'flex';
      };

      // 按「刪除」按鈕
      btnDeleteStore.onclick = function() {
        if (!editingStoreId) return;
        if (confirm('⚠️ 確定要刪除這個店舖標記嗎？')) {
          stores = stores.filter(s => s.id !== editingStoreId);
          modal.style.display = 'none';
          drawMap();
          renderStoreList();
        }
      };

      // 按「取消」按鈕
      document.getElementById('btnCancelStore').onclick = function() {
        pendingStoreObj = null;
        editingStoreId = null;
        modal.style.display = 'none';
      };

      // 按「儲存」按鈕
      document.getElementById('btnSaveStore').onclick = function() {
        let nameCn = document.getElementById('inputNameCn').value.trim();
        let nameEn = document.getElementById('inputNameEn').value.trim();
        let shopNo = document.getElementById('inputShopNo').value.trim();
        let category = selectCategory.value;
        let subCategory = (category === '購物') ? selectSubCategory.value : '';
        let remark = document.getElementById('inputRemark').value.trim();

        if (editingStoreId) {
          let store = stores.find(s => s.id === editingStoreId);
          if (store) {
            store.shopNo = shopNo;
            store.nameCn = nameCn;
            store.nameEn = nameEn;
            store.category = category;
            store.subCategory = subCategory;
            store.remark = remark;
          }
        } else if (pendingStoreObj) {
          pendingStoreObj.shopNo = shopNo;
          pendingStoreObj.nameCn = nameCn;
          pendingStoreObj.nameEn = nameEn;
          pendingStoreObj.category = category;
          pendingStoreObj.subCategory = subCategory;
          pendingStoreObj.remark = remark;

          stores.push(pendingStoreObj);
          pendingStoreObj = null;
        }

        modal.style.display = 'none';
        drawMap();
        renderStoreList();
      };

      function renderStoreList() {
        const container = document.getElementById('storeListContainer');
        document.getElementById('storeCount').innerText = stores.length;

        if (stores.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: #999; padding: 15px;">暫無店舖記錄</div>';
          return;
        }

        container.innerHTML = '';
        stores.forEach(s => {
          let adjusted = transformPoint(s.finalX, s.finalY);
          let div = document.createElement('div');
          div.className = 'store-item';
          div.onclick = function() { editStore(s.id); };
          
          let catText = s.category ? (s.subCategory ? `${s.category} > ${s.subCategory}` : s.category) : '未分類';

          div.innerHTML = `
            <header>
              <span>[${s.floor}] ${s.shopNo} - ${s.nameCn || '標記'} (${s.nameEn}) ✏️</span>
              <span style="color:#007aff;">${s.side.toUpperCase()}</span>
            </header>
            <div><strong>類別:</strong> <span style="color:#ff9500;">${catText}</span></div>
            <div><strong>備註:</strong> ${s.remark || '無'}</div>
            <div style="font-size:11px; color:#8e8e93; margin-top:2px;">
              調整後點 (Adjusted): (${adjusted.x.toFixed(2)}m, ${adjusted.y.toFixed(2)}m)
            </div>
          `;
          container.appendChild(div);
        });
      }

      function downloadFile(content, fileName, mimeType) {
        let blob = new Blob([content], { type: mimeType });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // 5. 匯出 CSV 與 GPX
      document.getElementById('btnExportCsv').onclick = function() {
        if (stores.length === 0 && pathHistory.length === 0) {
          alert('目前無任何店舖或軌跡資料可供匯出！');
          return;
        }

        let mallNameStr = document.getElementById('mallName').value.trim() || 'Mall';
        let currentFloorStr = getCurrentFloor();
        let tsStr = startTimestampStr || generateTimestamp();

        if (stores.length > 0) {
          let csvRows = [];
          csvRows.push([
            'Mall_Name',
            'Floor',
            'Shop_No',
            'Name_CN',
            'Name_EN',
            'Category',
            'Sub_Category',
            'Remark',
            'Side_Offset',
            'Offset_Dist_m',
            'GPS_Start_Lat',
            'GPS_Start_Lng',
            'Final_Y',
            'Final_X'
          ].join(','));

          stores.forEach(s => {
            let adj = transformPoint(s.finalX, s.finalY);
            let finalY = '', finalX = '';
            if (startGps.lat && startGps.lng) {
              finalY = (startGps.lat + (adj.y / 111000.0)).toFixed(7);
              finalX = (startGps.lng + (adj.x / (111000.0 * Math.cos(startGps.lat * Math.PI / 180.0)))).toFixed(7);
            }

            let row = [
              `"${s.mall}"`,
              `"${s.floor}"`,
              `"${s.shopNo}"`,
              `"${s.nameCn}"`,
              `"${s.nameEn}"`,
              `"${s.category || ''}"`,
              `"${s.subCategory || ''}"`,
              `"${s.remark}"`,
              `"${s.side}"`,
              s.offsetDist || 2.0,
              startGps.lat || '',
              startGps.lng || '',
              finalY,
              finalX
            ];
            csvRows.push(row.join(','));
          });

          let csvString = '\uFEFF' + csvRows.join('\n');
          let csvFileName = `${mallNameStr}_${currentFloorStr}_stores_${tsStr}.csv`;
          downloadFile(csvString, csvFileName, 'text/csv;charset=utf-8;');
        }

        // 僅匯出校正後的 GPX (Adjusted GPX Only)
        if (pathHistory.length > 0) {
          let adjTrkpts = '';
          pathHistory.forEach(pt => {
            let adjPt = transformPoint(pt.x, pt.y);
            let lat = startGps.lat ? (startGps.lat + (adjPt.y / 111000.0)).toFixed(7) : 0;
            let lng = startGps.lng ? (startGps.lng + (adjPt.x / (111000.0 * Math.cos(startGps.lat * Math.PI / 180.0)))).toFixed(7) : 0;
            adjTrkpts += `\n      <trkpt lat="${lat}" lon="${lng}"><time>${pt.timestamp}</time></trkpt>`;
          });

          let adjGpxContent = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="MallPDRMapper" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>${mallNameStr} ${currentFloorStr} (Adjusted)</name><trkseg>${adjTrkpts}\n  </trkseg></trk>
</gpx>`;

          let adjGpxFileName = `${mallNameStr}_${currentFloorStr}_track_adjusted_${tsStr}.gpx`;

          setTimeout(() => { downloadFile(adjGpxContent, adjGpxFileName, 'application/gpx+xml;charset=utf-8;'); }, 300);
        }
      };

      resizeCanvas();
    });
  </script>
</body>
