<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>AutoXing Mock API 路徑製作器 (Route Studio - 跨樓層版)</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; background: #141414; color: #eee;
    }
    #mapWrapper {
      flex: 1; position: relative; height: 100%;
    }
    #cesiumContainer { width: 100%; height: 100%; }
    #topHint {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(20, 20, 20, 0.88); padding: 10px 14px;
      border-radius: 6px; border-left: 4px solid #00a8e8; font-size: 13px;
    }
    #studioPanel {
      width: 430px; height: 100%; background: #1e1e1e;
      border-left: 1px solid #333; display: flex; flex-direction: column;
      padding: 16px; overflow-y: auto; gap: 12px;
    }
    h2 { margin: 0; font-size: 16px; color: #fff; display: flex; align-items: center; justify-content: space-between; }
    .badge { background: #0078d4; font-size: 11px; padding: 2px 7px; border-radius: 4px; }
    .card {
      background: #262626; border: 1px solid #383838; border-radius: 6px; padding: 12px;
    }
    .card-title { font-size: 12px; font-weight: bold; color: #aaa; margin-bottom: 8px; text-transform: uppercase; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    label { display: block; font-size: 11px; color: #bbb; margin-bottom: 3px; }
    input, select {
      width: 100%; background: #141414; border: 1px solid #444; color: #fff;
      padding: 6px 8px; border-radius: 4px; font-size: 12px;
    }
    .btn-row { display: flex; gap: 6px; margin-top: 8px; }
    button {
      flex: 1; padding: 8px 10px; border: none; border-radius: 4px;
      font-size: 12px; font-weight: bold; cursor: pointer; color: #fff;
      background: #0078d4;
    }
    button:hover { background: #106ebe; }
    button.danger { background: #c50f1f; }
    button.danger:hover { background: #a40c19; }
    button.secondary { background: #3b3b3b; }
    button.secondary:hover { background: #4a4a4a; }
    button.success { background: #107c10; }
    button.success:hover { background: #0d650d; }
    .wp-list {
      max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 8px;
    }
    .wp-row {
      display: grid; grid-template-columns: 44px 1fr 64px 72px; gap: 6px; align-items: center;
      background: #1b1b1b; border: 1px solid #333; padding: 5px 7px; border-radius: 4px; font-size: 11px;
    }
    .wp-row input, .wp-row select {
      padding: 3px 5px; font-size: 11px;
    }
    textarea {
      width: 100%; height: 140px; background: #111; color: #4fc3f7;
      border: 1px solid #333; border-radius: 4px; padding: 8px;
      font-family: monospace; font-size: 11px; resize: vertical;
    }
    .live-stream {
      background: #0d0d0d; color: #8ce99a; font-family: monospace;
      font-size: 11px; padding: 8px; border-radius: 4px; min-height: 75px;
      white-space: pre-wrap; border: 1px solid #2b2b2b;
    }
  </style>
</head>
<body>

  <div id="mapWrapper">
    <div id="cesiumContainer"></div>
    <div id="topHint">
      <strong>操作說明：</strong><br>
      • <b>左鍵單擊地板</b>：新增路徑轉折點（預設套用目前選擇的樓層與 floorZ）<br>
      • <b>跨樓層搭 Lift</b>：可在下方「路徑點明細」把某一點的樓層改為其他樓層，並設定 <code>waitSec</code> 停留秒數<br>
      • <b>右鍵拖曳</b>：平移畫面 ｜ <b>滾輪</b>：縮放 ｜ <b>中鍵拖曳</b>：傾斜視角
    </div>
  </div>

  <div id="studioPanel">
    <h2>AutoXing Mock 路徑製作器 <span class="badge">跨樓層版</span></h2>

    <!-- 1. 樓層模型與基準 Z 高度 -->
    <div class="card">
      <div class="card-title">1. 樓層模型與基準高度 (floorZ)</div>
      <div class="grid-2">
        <div>
          <label>目前編輯樓層</label>
          <select id="modelSelect"></select>
        </div>
        <div>
          <label>視角輔助</label>
          <button class="secondary" id="resetTopViewBtn" style="margin-top:0;">重置垂直俯視角</button>
        </div>
      </div>
      <div class="grid-2" style="margin-top: 8px;">
        <div>
          <label>該樓層預設 floorZ (m)</label>
          <input type="number" id="floorZInput" value="-1.2" step="0.1">
        </div>
        <div>
          <label>樓層編號 (Floor)</label>
          <input type="number" id="floorInput" value="11">
        </div>
      </div>
    </div>

    <!-- 2. 機器人與模擬參數 -->
    <div class="card">
      <div class="card-title">2. AutoXing 模擬機器人參數</div>
      <div class="grid-3">
        <div>
          <label>Robot ID</label>
          <input type="text" id="robotIdInput" value="AX_ROBOT_001">
        </div>
        <div>
          <label>速度 (m/s)</label>
          <input type="number" id="speedInput" value="0.8" step="0.1" min="0.1">
        </div>
        <div>
          <label>推播頻率 (Hz)</label>
          <input type="number" id="hzInput" value="10" step="1" min="1" max="30">
        </div>
      </div>
      <div class="grid-2" style="margin-top: 8px;">
        <div>
          <label>巡邏模式</label>
          <select id="loopSelect">
            <option value="loop">閉合循環巡邏 (Loop)</option>
            <option value="pingpong">原路折返巡邏 (Ping-Pong)</option>
            <option value="once">單次走到終點 (Once)</option>
          </select>
        </div>
        <div>
          <label>地圖原點旋轉角 (°)</label>
          <input type="number" id="calRot" value="0" step="1">
        </div>
      </div>
    </div>

    <!-- 3. 座標系偏移校準 -->
    <div class="card">
      <div class="card-title">3. AutoXing 地圖原點偏移校準 (選填)</div>
      <div class="grid-2">
        <div>
          <label>Offset X (m)</label>
          <input type="number" id="calX" value="0" step="0.1">
        </div>
        <div>
          <label>Offset Y (m)</label>
          <input type="number" id="calY" value="0" step="0.1">
        </div>
      </div>
    </div>

    <!-- 4. 路徑點明細（支援單點改樓層與 waitSec）與匯出 -->
    <div class="card">
      <div class="card-title">4. 路徑點明細 (<span id="pointCount">0</span> 點)</div>
      <div class="wp-list" id="waypointListContainer">
        <div style="font-size:11px; color:#777;">尚未建立路徑點...</div>
      </div>
      <div class="btn-row" style="margin-top:0; margin-bottom:8px;">
        <button class="secondary" id="undoPointBtn">撤銷最後一點</button>
        <button class="danger" id="clearPointsBtn">清空全部路徑</button>
      </div>
      <textarea id="jsonOutput" readonly placeholder="請在左側 3D 模型地板上點擊左鍵建立路徑點..."></textarea>
      <div class="btn-row">
        <button class="secondary" id="copyJsonBtn">複製路徑設定 JSON</button>
        <button class="secondary" id="downloadJsonBtn">下載 .json 檔</button>
      </div>
    </div>

    <!-- 5. 即時模擬推播測試 -->
    <div class="card">
      <div class="card-title">5. Mock AutoXing API 即時推播測試</div>
      <div class="btn-row" style="margin-top:0; margin-bottom:8px;">
        <button class="success" id="startSimBtn">啟動模擬推播 (Start)</button>
        <button class="danger" id="stopSimBtn" disabled>停止 (Stop)</button>
      </div>
      <label>即時發送的 AutoXing Payload（同步透過 BroadcastChannel 廣播）：</label>
      <div class="live-stream" id="livePayloadBox">尚未啟動推播...</div>
    </div>
  </div>

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IkZqU3ltVnAtUXJJeHJiX20iLCJqdGkiOiJjNGIzMjQ1ZS0xM2EyLTQ2NWMtYWYwOS1mYWUxOTMyZjllNmMiLCJpZCI6NTUyNjg2LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTUwODIzODd9.JEBZaZMgJZBqkYtDQ3qWukrTRelSvU5slfcznBTGd2Q';

    // 與 3d_display_walk.html 同步的樓層模型與預設 floorZ
    const MODELS_CONFIG = [
      { id: 'model_13f', name: '13/f', floor: 13, assetId: 6184026, defaultFloorZ: -1.2 },
      { id: 'model_12f', name: '12/f', floor: 12, assetId: 6183954, defaultFloorZ: -1.2 },
      { id: 'model_11f', name: '11/f', floor: 11, assetId: 6179670, defaultFloorZ: -1.2 }
    ];

    const ROBOT_HEIGHT = 0.7;
    const mockChannel = new BroadcastChannel('autoxing_mock_telemetry');

    function extractFloorNumber(floorInput) {
      if (floorInput === undefined || floorInput === null) return null;
      const match = String(floorInput).match(/-?\d+/);
      return match ? parseInt(match[0], 10) : null;
    }

    async function initStudio() {
      const viewer = new Cesium.Viewer('cesiumContainer', {
        terrain: Cesium.Terrain.fromWorldTerrain(),
        timeline: false,
        animation: false,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        selectionIndicator: false,
        infoBox: false
      });

      const scene = viewer.scene;
      scene.screenSpaceCameraController.enableCollisionDetection = false;
      scene.camera.frustum.near = 0.05;

      const modelSelect = document.getElementById('modelSelect');
      const floorInput = document.getElementById('floorInput');
      const floorZInput = document.getElementById('floorZInput');

      const loadedModels = {}; // key: model.id
      const floorDataByNum = {}; // key: floorNum
      let currentModelId = MODELS_CONFIG[0].id;

      // 儲存整條路線的轉折點（支援跨樓層）：[{ x, y, z, floor, waitSec, modelId }]
      const routeWaypoints = [];

      for (const item of MODELS_CONFIG) {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name;
        modelSelect.appendChild(opt);

        try {
          const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(item.assetId, {
            maximumScreenSpaceError: 4
          });
          scene.primitives.add(tileset);

          const center = tileset.boundingSphere.center.clone();
          const enuMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(center);
          const invEnuMatrix = Cesium.Matrix4.inverse(enuMatrix, new Cesium.Matrix4());

          const mObj = {
            config: item,
            tileset,
            enuMatrix,
            invEnuMatrix,
            floorZ: item.defaultFloorZ
          };
          loadedModels[item.id] = mObj;
          floorDataByNum[item.floor] = mObj;
        } catch (err) {
          console.error('模型載入失敗:', item.name, err);
        }
      }

      function getWorldPosFromLocal(floorNum, localX, localY, localZ) {
        const mObj = floorDataByNum[floorNum] || loadedModels[currentModelId];
        if (!mObj) return null;
        const zVal = (localZ !== undefined && localZ !== null) ? localZ : mObj.floorZ;
        const pt = new Cesium.Cartesian3(localX, localY, zVal + (ROBOT_HEIGHT / 2));
        return Cesium.Matrix4.multiplyByPoint(mObj.enuMatrix, pt, new Cesium.Cartesian3());
      }

      function focusModelTopView(modelId) {
        const m = loadedModels[modelId];
        if (!m) return;
        floorInput.value = m.config.floor;
        floorZInput.value = m.floorZ;

        Object.keys(loadedModels).forEach(id => {
          loadedModels[id].tileset.show = (id === modelId);
        });

        viewer.camera.flyToBoundingSphere(m.tileset.boundingSphere, {
          duration: 0.6,
          offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-90), Math.max(m.tileset.boundingSphere.radius * 2.2, 20))
        });
      }

      focusModelTopView(currentModelId);

      modelSelect.onchange = (e) => {
        currentModelId = e.target.value;
        focusModelTopView(currentModelId);
        renderRouteGraphics();
        renderWaypointList();
        updateJsonOutput();
      };

      floorZInput.onchange = () => {
        const val = parseFloat(floorZInput.value);
        if (!Number.isNaN(val) && loadedModels[currentModelId]) {
          loadedModels[currentModelId].floorZ = val;
          renderRouteGraphics();
          updateJsonOutput();
        }
      };

      document.getElementById('resetTopViewBtn').onclick = () => focusModelTopView(currentModelId);

      // ==========================================
      // 畫布點擊錄製路徑點與繪製預覽
      // ==========================================
      const pointEntities = [];
      const polylineEntities = [];
      let simRobotEntity = null;

      function renderRouteGraphics() {
        pointEntities.forEach(e => viewer.entities.remove(e));
        pointEntities.length = 0;
        polylineEntities.forEach(e => viewer.entities.remove(e));
        polylineEntities.length = 0;

        if (routeWaypoints.length === 0) return;

        const worldPts = routeWaypoints.map(wp => ({
          wp,
          pos: getWorldPosFromLocal(wp.floor, wp.x, wp.y, wp.z)
        })).filter(item => item.pos !== null);

        worldPts.forEach((item, idx) => {
          const isLiftPt = idx > 0 && item.wp.floor !== worldPts[idx - 1].wp.floor;
          const ent = viewer.entities.add({
            position: item.pos,
            point: {
              pixelSize: 10,
              color: isLiftPt ? Cesium.Color.ORANGE : (idx === 0 ? Cesium.Color.LIME : Cesium.Color.YELLOW),
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2
            },
            label: {
              text: `#${idx + 1} (${item.wp.floor}F${item.wp.waitSec ? ` ${item.wp.waitSec}s` : ''})`,
              font: 'bold 11px sans-serif',
              fillColor: Cesium.Color.WHITE,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              pixelOffset: new Cesium.Cartesian2(0, -16),
              disableDepthTestDistance: Number.POSITIVE_INFINITY
            }
          });
          pointEntities.push(ent);
        });

        for (let i = 0; i < worldPts.length - 1; i++) {
          const a = worldPts[i];
          const b = worldPts[i + 1];
          const crossFloor = a.wp.floor !== b.wp.floor;
          const line = viewer.entities.add({
            polyline: {
              positions: [a.pos, b.pos],
              width: 3,
              material: crossFloor
                ? new Cesium.PolylineDashMaterialProperty({ color: Cesium.Color.ORANGE })
                : Cesium.Color.CYAN
            }
          });
          polylineEntities.push(line);
        }

        if (document.getElementById('loopSelect').value === 'loop' && worldPts.length >= 2) {
          const first = worldPts[0];
          const last = worldPts[worldPts.length - 1];
          const crossFloor = first.wp.floor !== last.wp.floor;
          polylineEntities.push(viewer.entities.add({
            polyline: {
              positions: [last.pos, first.pos],
              width: 3,
              material: crossFloor
                ? new Cesium.PolylineDashMaterialProperty({ color: Cesium.Color.ORANGE })
                : Cesium.Color.CYAN
            }
          }));
        }
      }

      function renderWaypointList() {
        const container = document.getElementById('waypointListContainer');
        if (routeWaypoints.length === 0) {
          container.innerHTML = `<div style="font-size:11px; color:#777;">尚未建立路徑點...</div>`;
          return;
        }

        container.innerHTML = '';
        routeWaypoints.forEach((wp, idx) => {
          const row = document.createElement('div');
          row.className = 'wp-row';
          row.innerHTML = `
            <strong>#${idx + 1}</strong>
            <span style="color:#ccc;">(${wp.x.toFixed(1)}, ${wp.y.toFixed(1)})</span>
            <select title="所屬樓層 (搭 Lift 可切換樓層)">
              <option value="13" ${wp.floor === 13 ? 'selected' : ''}>13F</option>
              <option value="12" ${wp.floor === 12 ? 'selected' : ''}>12F</option>
              <option value="11" ${wp.floor === 11 ? 'selected' : ''}>11F</option>
            </select>
            <input type="number" min="0" step="0.5" value="${wp.waitSec || 0}" title="停留秒數 waitSec">
          `;

          const selEl = row.querySelector('select');
          const waitEl = row.querySelector('input');

          selEl.onchange = () => {
            const newFloor = Number(selEl.value);
            wp.floor = newFloor;
            const targetFloorObj = floorDataByNum[newFloor];
            if (targetFloorObj) wp.z = targetFloorObj.floorZ;
            renderRouteGraphics();
            updateJsonOutput();
          };

          waitEl.onchange = () => {
            wp.waitSec = Number(waitEl.value) || 0;
            renderRouteGraphics();
            updateJsonOutput();
          };

          container.appendChild(row);
        });
      }

      const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
      handler.setInputAction((click) => {
        const m = loadedModels[currentModelId];
        if (!m) return;

        const worldPos = scene.pickPosition(click.position);
        if (!Cesium.defined(worldPos)) return;

        const localPos = Cesium.Matrix4.multiplyByPoint(m.invEnuMatrix, worldPos, new Cesium.Cartesian3());
        const activeFloor = Number(floorInput.value) || m.config.floor;
        const activeFloorZ = parseFloat(floorZInput.value);
        const zVal = Number.isNaN(activeFloorZ) ? m.floorZ : activeFloorZ;

        routeWaypoints.push({
          x: Number(localPos.x.toFixed(3)),
          y: Number(localPos.y.toFixed(3)),
          z: Number(zVal.toFixed(3)),
          floor: activeFloor,
          waitSec: 0
        });

        renderRouteGraphics();
        renderWaypointList();
        updateJsonOutput();
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      document.getElementById('undoPointBtn').onclick = () => {
        if (routeWaypoints.length > 0) {
          routeWaypoints.pop();
          renderRouteGraphics();
          renderWaypointList();
          updateJsonOutput();
        }
      };

      document.getElementById('clearPointsBtn').onclick = () => {
        routeWaypoints.length = 0;
        renderRouteGraphics();
        renderWaypointList();
        updateJsonOutput();
      };

      // ==========================================
      // 坐標校準與 JSON 匯出
      // ==========================================
      function toAutoXingLocal(pt) {
        const offX = parseFloat(document.getElementById('calX').value) || 0;
        const offY = parseFloat(document.getElementById('calY').value) || 0;
        const rotRad = Cesium.Math.toRadians(parseFloat(document.getElementById('calRot').value) || 0);

        const dx = pt.x - offX;
        const dy = pt.y - offY;
        const axX = dx * Math.cos(-rotRad) - dy * Math.sin(-rotRad);
        const axY = dx * Math.sin(-rotRad) + dy * Math.cos(-rotRad);

        return {
          x: Number(axX.toFixed(3)),
          y: Number(axY.toFixed(3))
        };
      }

      function updateJsonOutput() {
        document.getElementById('pointCount').textContent = routeWaypoints.length;
        const baseFloor = Number(floorInput.value) || 11;
        const baseFloorZ = parseFloat(floorZInput.value);

        const exportData = {
          modelId: currentModelId,
          robotId: document.getElementById('robotIdInput').value,
          floor: baseFloor,
          floorZ: Number.isNaN(baseFloorZ) ? -1.2 : baseFloorZ,
          speed: Number(document.getElementById('speedInput').value),
          loopMode: document.getElementById('loopSelect').value,
          waypoints: routeWaypoints.map(wp => {
            const axPos = toAutoXingLocal(wp);
            const item = {
              x: axPos.x,
              y: axPos.y,
              z: wp.z,
              floor: wp.floor
            };
            if (wp.waitSec && wp.waitSec > 0) item.waitSec = wp.waitSec;
            return item;
          })
        };

        document.getElementById('jsonOutput').value = JSON.stringify(exportData, null, 2);
      }

      ['robotIdInput', 'speedInput', 'floorInput', 'floorZInput', 'loopSelect', 'calX', 'calY', 'calRot'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
          renderRouteGraphics();
          updateJsonOutput();
        });
      });

      document.getElementById('copyJsonBtn').onclick = () => {
        const outEl = document.getElementById('jsonOutput');
        outEl.select();
        document.execCommand('copy');
        alert('已複製路徑 JSON 設定至剪貼簿！');
      };

      document.getElementById('downloadJsonBtn').onclick = () => {
        const blob = new Blob([document.getElementById('jsonOutput').value], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentModelId}_route.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // ==========================================
      // Mock AutoXing API 即時模擬推播引擎（支援跨樓層搭 Lift）
      // ==========================================
      let simTimer = null;

      document.getElementById('startSimBtn').onclick = () => {
        if (routeWaypoints.length < 2) {
          alert('請先在左側模型地板點擊至少 2 個路徑點！');
          return;
        }

        document.getElementById('startSimBtn').disabled = true;
        document.getElementById('stopSimBtn').disabled = false;

        let pts = routeWaypoints.map(wp => ({
          ...wp,
          worldPos: getWorldPosFromLocal(wp.floor, wp.x, wp.y, wp.z)
        })).filter(p => p.worldPos !== null);

        const loopMode = document.getElementById('loopSelect').value;
        if (loopMode === 'pingpong' && pts.length > 2) {
          pts = pts.concat(pts.slice(1, -1).reverse());
        }

        if (simRobotEntity) viewer.entities.remove(simRobotEntity);
        simRobotEntity = viewer.entities.add({
          position: pts[0].worldPos,
          cylinder: {
            length: ROBOT_HEIGHT, topRadius: 0.32, bottomRadius: 0.35,
            material: Cesium.Color.DEEPSKYBLUE.withAlpha(0.95),
            outline: true, outlineColor: Cesium.Color.WHITE
          }
        });

        let segIdx = 0;
        let segDist = 0;
        let waitRemaining = 0;
        let battery = 96.0;
        const speed = parseFloat(document.getElementById('speedInput').value) || 0.8;
        const hz = parseInt(document.getElementById('hzInput').value) || 10;
        const dt = 1 / hz;

        simTimer = setInterval(() => {
          if (loopMode === 'once' && segIdx >= pts.length - 1) return;

          if (waitRemaining > 0) {
            waitRemaining = Math.max(0, waitRemaining - dt);
            return;
          }

          const p1 = pts[segIdx];
          const nextIdx = (segIdx + 1) % pts.length;
          const p2 = pts[nextIdx];

          const isCrossFloor = p1.floor !== p2.floor;
          const dist = isCrossFloor
            ? Cesium.Cartesian3.distance(p1.worldPos, p2.worldPos)
            : Math.hypot(p2.x - p1.x, p2.y - p1.y);

          if (dist < 0.001) {
            segIdx = nextIdx;
            waitRemaining = p2.waitSec || 0;
            return;
          }

          const moveSpeed = isCrossFloor ? Math.min(speed, 1.5) : speed;
          segDist += moveSpeed * dt;
          if (segDist >= dist) {
            segDist -= dist;
            segIdx = nextIdx;
            waitRemaining = p2.waitSec || 0;
            return;
          }

          const ratio = segDist / dist;
          const curX = p1.x + (p2.x - p1.x) * ratio;
          const curY = p1.y + (p2.y - p1.y) * ratio;
          const curZ = p1.z + (p2.z - p1.z) * ratio;

          let worldPos;
          let activeFloor = p1.floor;

          if (isCrossFloor) {
            worldPos = Cesium.Cartesian3.lerp(p1.worldPos, p2.worldPos, ratio, new Cesium.Cartesian3());
            activeFloor = ratio >= 0.5 ? p2.floor : p1.floor;
          } else {
            worldPos = getWorldPosFromLocal(p1.floor, curX, curY, curZ);
          }

          if (worldPos) simRobotEntity.position = worldPos;

          const axPos = toAutoXingLocal({ x: curX, y: curY });
          const rotRad = Cesium.Math.toRadians(parseFloat(document.getElementById('calRot').value) || 0);
          const axYawRad = Math.atan2(p2.y - p1.y, p2.x - p1.x) - rotRad;
          battery = Math.max(10, battery - 0.001);

          const axPayload = {
            robotId: document.getElementById('robotIdInput').value,
            modelId: currentModelId,
            timestamp: Date.now(),
            battery: Math.round(battery),
            moveState: isCrossFloor ? 'lift' : 'moving',
            floor: activeFloor,
            isLiftTransition: isCrossFloor,
            overrideWorldPos: isCrossFloor ? worldPos : null,
            pose: {
              x: axPos.x,
              y: axPos.y,
              z: Number(curZ.toFixed(3)),
              yaw: Number(axYawRad.toFixed(4))
            }
          };

          document.getElementById('livePayloadBox').textContent = JSON.stringify({
            robotId: axPayload.robotId,
            floor: axPayload.floor,
            moveState: axPayload.moveState,
            battery: axPayload.battery,
            pose: axPayload.pose
          }, null, 2);

          mockChannel.postMessage(axPayload);
        }, dt * 1000);
      };

      document.getElementById('stopSimBtn').onclick = () => {
        if (simTimer) clearInterval(simTimer);
        simTimer = null;
        document.getElementById('startSimBtn').disabled = false;
        document.getElementById('stopSimBtn').disabled = true;
      };
    }

    initStudio();
  </script>
</body>
