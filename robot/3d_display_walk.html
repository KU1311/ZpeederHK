<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Cesium LiDAR 室內走廊（人眼漫遊與中心視察版）</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #toolbar {
      position: absolute; top: 12px; left: 12px; z-index: 999;
      background: rgba(25, 25, 25, 0.92); color: white;
      padding: 14px 16px; border-radius: 8px; font-family: sans-serif; font-size: 13px;
      width: 315px; box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .mode-switch {
      display: flex; gap: 6px; margin: 10px 0; background: #111; padding: 4px; border-radius: 6px;
    }
    .mode-btn {
      flex: 1; padding: 7px 6px; border: none; border-radius: 4px; cursor: pointer;
      font-size: 12px; font-weight: bold; background: transparent; color: #aaa;
    }
    .mode-btn.active {
      background: #0078d4; color: white;
    }
    .btn-group {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    button.action-btn {
      background: #333; color: white; border: 1px solid #555;
      padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    button.action-btn:hover { background: #444; }
    .guide-box {
      background: rgba(0, 120, 212, 0.15); border-left: 3px solid #0078d4;
      padding: 8px 10px; margin-top: 8px; font-size: 12px; line-height: 1.5; color: #ddd;
    }
    #modelList {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #444;
    }
    .model-item {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px; background: rgba(255,255,255,0.06);
      padding: 6px 8px; border-radius: 4px;
    }
    .model-item label {
      display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1;
    }
    .fly-mini-btn {
      padding: 3px 8px; font-size: 11px; background: #2b88d8; border: none; color: white; border-radius: 3px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="toolbar">
    <div style="font-size: 15px; font-weight: bold;">LiDAR 室內外空間導航檢視器</div>

    <!-- 導航模式切換 -->
    <div class="mode-switch">
      <button id="orbitModeBtn" class="mode-btn active">中心環繞視察 (Orbit)</button>
      <button id="fpvModeBtn" class="mode-btn">人眼第一人稱 (WASD)</button>
    </div>

    <div id="controlGuide" class="guide-box">
      <strong>中心視察模式：</strong><br>
      • <b>雙擊滑鼠左鍵</b>：將點擊位置設為旋轉中心並靠近<br>
      • <b>左鍵拖曳</b>：繞著中心點 360° 環顧四周<br>
      • <b>右鍵拖曳</b>：平行移動位置 ｜ <b>滾輪</b>：前後推拉
    </div>

    <div class="btn-group">
      <button id="topViewBtn" class="action-btn">一鍵俯視角</button>
      <button id="eyeLevelBtn" class="action-btn">切換人眼高度 (1.6m)</button>
      <button id="toggleBuildingsBtn" class="action-btn">外部建築透明度</button>
    </div>

    <div id="modelList">
      <div style="font-size: 12px; color: #aaa; margin-bottom: 6px;">模型圖層控制：</div>
    </div>
  </div>

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IkZqU3ltVnAtUXJJeHJiX20iLCJqdGkiOiJjNGIzMjQ1ZS0xM2EyLTQ2NWMtYWYwOS1mYWUxOTMyZjllNmMiLCJpZCI6NTUyNjg2LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTUwODIzODd9.JEBZaZMgJZBqkYtDQ3qWukrTRelSvU5slfcznBTGd2Q';

    // ==========================================
    // 【簡易模型清單】在此自由增減模型與 Asset ID
    // ==========================================
    const MODELS_CONFIG = [
      { name: '走廊樓層1', assetId: 6184026, show: true },
	  { name: '走廊樓層2', assetId: 6183954, show: true },
	  { name: '走廊樓層3', assetId: 6179670, show: true }
      // { name: '走廊區塊 B (轉角)', assetId: 1234567, show: true },
      // { name: '電梯大堂', assetId: 7654321, show: false }
    ];

    async function init() {
      const viewer = new Cesium.Viewer('cesiumContainer', {
        terrain: Cesium.Terrain.fromWorldTerrain(),
        timeline: false,
        animation: false,
        selectionIndicator: false,
        infoBox: false
      });

      const scene = viewer.scene;
      const camera = viewer.camera;
      const controller = scene.screenSpaceCameraController;

      // 1. 解除室內導航的各種地球尺度限制
      controller.enableCollisionDetection = false; // 允許穿牆/進入室內
      controller.minimumZoomDistance = 0.1;        // 允許極近距離縮放 (10cm)
      controller.maximumZoomDistance = 5000;
      camera.frustum.near = 0.05;                  // 避免靠近牆壁破圖

      // 載入半透明 OSM 3D 建築物
      const osmBuildings = await Cesium.createOsmBuildingsAsync();
      osmBuildings.style = new Cesium.Cesium3DTileStyle({
        color: "color('white', 0.35)"
      });
      scene.primitives.add(osmBuildings);

      // 2. 載入所有模型
      const modelListContainer = document.getElementById('modelList');
      let activeTileset = null;

      for (const item of MODELS_CONFIG) {
        try {
          const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(item.assetId, {
            maximumScreenSpaceError: 4
          });
          tileset.show = item.show;
          scene.primitives.add(tileset);
          if (!activeTileset) activeTileset = tileset;

          const row = document.createElement('div');
          row.className = 'model-item';
          row.innerHTML = `
            <label>
              <input type="checkbox" ${item.show ? 'checked' : ''}>
              <span>${item.name}</span>
            </label>
            <button class="fly-mini-btn">定位</button>
          `;
          row.querySelector('input').onchange = (e) => { tileset.show = e.target.checked; };
          row.querySelector('button').onclick = () => {
            activeTileset = tileset;
            viewer.camera.flyToBoundingSphere(tileset.boundingSphere, {
              offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), 15)
            });
          };
          modelListContainer.appendChild(row);
        } catch (error) {
          console.error(`載入模型 "${item.name}" 失敗:`, error);
        }
      }

      if (activeTileset) {
        await viewer.zoomTo(activeTileset, new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), 20));
      }

      // ==========================================
      // 功能 A：雙擊滑鼠左鍵，以點擊的點為中心進行環繞視察
      // ==========================================
      let pivotMarker = null;
      const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);

      handler.setInputAction((movement) => {
        if (isFpvMode) return;
        // 拾取點擊位置的 3D 模型表面座標
        const pickedPosition = scene.pickPosition(movement.position);
        if (Cesium.defined(pickedPosition)) {
          // 顯示一個短暫的綠色小光點提示新的旋轉中心
          if (pivotMarker) viewer.entities.remove(pivotMarker);
          pivotMarker = viewer.entities.add({
            position: pickedPosition,
            point: { pixelSize: 10, color: Cesium.Color.LIME, outlineColor: Cesium.Color.BLACK, outlineWidth: 2 }
          });

          // 將相機對準該點，並保持在距離 3.5 公尺處方便四周視察
          const boundingSphere = new Cesium.BoundingSphere(pickedPosition, 1.0);
          camera.flyToBoundingSphere(boundingSphere, {
            duration: 0.8,
            offset: new Cesium.HeadingPitchRange(camera.heading, Cesium.Math.toRadians(-15), 3.5)
          });
        }
      }, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

      // ==========================================
      // 功能 B：第一人稱人眼視角漫遊 (WASD + 滑鼠環顧)
      // ==========================================
      let isFpvMode = false;
      const flags = { moveForward: false, moveBackward: false, moveLeft: false, moveRight: false, moveUp: false, moveDown: false, look: false };
      let startMousePosition, mousePosition;

      // 切換「中心環繞模式」與「人眼第一人稱模式」
      function setNavigationMode(fpv) {
        isFpvMode = fpv;
        document.getElementById('orbitModeBtn').classList.toggle('active', !fpv);
        document.getElementById('fpvModeBtn').classList.toggle('active', fpv);

        // 停用/啟用 Cesium 預設滑鼠控制
        controller.enableRotate = !fpv;
        controller.enableTranslate = !fpv;
        controller.enableZoom = !fpv;
        controller.enableTilt = !fpv;
        controller.enableLook = !fpv;

        if (fpv) {
          if (pivotMarker) viewer.entities.remove(pivotMarker);
          // 將相機水平拉平，進入人眼平視角度
          camera.setView({
            orientation: { heading: camera.heading, pitch: 0.0, roll: 0.0 }
          });
          document.getElementById('controlGuide').innerHTML = `
            <strong>人眼第一人稱模式（已鎖定平視）：</strong><br>
            • <b>W / S</b>：前進 / 後退 ｜ <b>A / D</b>：左移 / 右移<br>
            • <b>Q / E</b>：升高 / 降低視線高度<br>
            • <b>按住左鍵拖曳</b>：原地轉頭環顧四周（不會歪斜）
          `;
        } else {
          document.getElementById('controlGuide').innerHTML = `
            <strong>中心視察模式：</strong><br>
            • <b>雙擊滑鼠左鍵</b>：將點擊位置設為旋轉中心並靠近<br>
            • <b>左鍵拖曳</b>：繞著中心點 360° 環顧四周<br>
            • <b>右鍵拖曳</b>：平行移動位置 ｜ <b>滾輪</b>：前後推拉
          `;
        }
      }

      document.getElementById('orbitModeBtn').onclick = () => setNavigationMode(false);
      document.getElementById('fpvModeBtn').onclick = () => setNavigationMode(true);

      // 第一人稱滑鼠原地轉頭控制
      handler.setInputAction((movement) => {
        if (!isFpvMode) return;
        flags.look = true;
        mousePosition = startMousePosition = Cesium.Cartesian3.clone(movement.position);
      }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

      handler.setInputAction((movement) => {
        if (!isFpvMode || !flags.look) return;
        mousePosition = movement.endPosition;
      }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

      handler.setInputAction(() => { flags.look = false; }, Cesium.ScreenSpaceEventType.LEFT_UP);

      // 鍵盤 WASD 監聽
      document.addEventListener('keydown', (e) => {
        if (!isFpvMode) return;
        switch (e.code) {
          case 'KeyW': case 'ArrowUp': flags.moveForward = true; break;
          case 'KeyS': case 'ArrowDown': flags.moveBackward = true; break;
          case 'KeyA': case 'ArrowLeft': flags.moveLeft = true; break;
          case 'KeyD': case 'ArrowRight': flags.moveRight = true; break;
          case 'KeyE': flags.moveUp = true; break;
          case 'KeyQ': flags.moveDown = true; break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'KeyW': case 'ArrowUp': flags.moveForward = false; break;
          case 'KeyS': case 'ArrowDown': flags.moveBackward = false; break;
          case 'KeyA': case 'ArrowLeft': flags.moveLeft = false; break;
          case 'KeyD': case 'ArrowRight': flags.moveRight = false; break;
          case 'KeyE': flags.moveUp = false; break;
          case 'KeyQ': flags.moveDown = false; break;
        }
      });

      // 每幀更新第一人稱移動與轉向（速度設為適合步行的 0.08 公尺/幀）
      viewer.clock.onTick.addEventListener(() => {
        if (!isFpvMode) return;

        // 1. 滑鼠原地轉頭（保持 Roll = 0 避免畫面歪斜）
        if (flags.look) {
          const width = scene.canvas.clientWidth;
          const height = scene.canvas.clientHeight;
          const x = (mousePosition.x - startMousePosition.x) / width;
          const y = -(mousePosition.y - startMousePosition.y) / height;
          const lookFactor = 0.05;

          const newHeading = camera.heading + x * lookFactor * 15;
          const newPitch = Cesium.Math.clamp(
            camera.pitch + y * lookFactor * 10,
            Cesium.Math.toRadians(-85),
            Cesium.Math.toRadians(85)
          );
          camera.setView({
            orientation: { heading: newHeading, pitch: newPitch, roll: 0.0 }
          });
        }

        // 2. 水平方向前後左右步行移動（確保按 W 時不會因為低頭而鑽進地板）
        const walkSpeed = 0.08;
        const forwardDir = new Cesium.Cartesian3();
        // 取得水平朝向向量
        const transform = Cesium.Transforms.eastNorthUpToFixedFrame(camera.positionWC);
        const h = camera.heading;
        const localForward = new Cesium.Cartesian3(Math.sin(h), Math.cos(h), 0);
        const localRight = new Cesium.Cartesian3(Math.cos(h), -Math.sin(h), 0);

        const worldForward = Cesium.Matrix4.multiplyByPointAsVector(transform, localForward, new Cesium.Cartesian3());
        const worldRight = Cesium.Matrix4.multiplyByPointAsVector(transform, localRight, new Cesium.Cartesian3());

        if (flags.moveForward) camera.move(worldForward, walkSpeed);
        if (flags.moveBackward) camera.move(worldForward, -walkSpeed);
        if (flags.moveRight) camera.move(worldRight, walkSpeed);
        if (flags.moveLeft) camera.move(worldRight, -walkSpeed);
        if (flags.moveUp) camera.moveUp(walkSpeed);
        if (flags.moveDown) camera.moveDown(walkSpeed);
      });

      // ==========================================
      // 功能 C：工具列快捷按鈕
      // ==========================================
      document.getElementById('topViewBtn').onclick = () => {
        setNavigationMode(false);
        if (!activeTileset) return;
        viewer.camera.flyToBoundingSphere(activeTileset.boundingSphere, {
          offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-90), Math.max(activeTileset.boundingSphere.radius * 2.5, 25))
        });
      };

      // 切換人眼高度：直接飛進走廊並自動進入第一人稱模式
      document.getElementById('eyeLevelBtn').onclick = () => {
        if (!activeTileset) return;
        const center = activeTileset.boundingSphere.center;
        camera.flyToBoundingSphere(activeTileset.boundingSphere, {
          duration: 1.0,
          offset: new Cesium.HeadingPitchRange(0, 0, 1.5),
          complete: () => {
            setNavigationMode(true);
          }
        });
      };

      let isTransparent = true;
      document.getElementById('toggleBuildingsBtn').onclick = () => {
        isTransparent = !isTransparent;
        osmBuildings.style = new Cesium.Cesium3DTileStyle({
          color: isTransparent ? "color('white', 0.35)" : "color('white', 0.0)"
        });
      };
    }

    init();
  </script>
</body>
</html>
