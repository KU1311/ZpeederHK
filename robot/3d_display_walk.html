<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Cesium LiDAR 室內走廊（多樓層 Robot 穩定高度版）</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #toolbar {
      position: absolute; top: 12px; left: 12px; z-index: 999;
      background: rgba(25, 25, 25, 0.92); color: white;
      padding: 14px 16px; border-radius: 8px; font-family: sans-serif; font-size: 13px;
      width: 330px; box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      max-height: 92vh; overflow-y: auto;
    }
    .mode-switch {
      display: flex; gap: 6px; margin: 10px 0; background: #111; padding: 4px; border-radius: 6px;
    }
    .mode-btn {
      flex: 1; padding: 7px 6px; border: none; border-radius: 4px; cursor: pointer;
      font-size: 12px; font-weight: bold; background: transparent; color: #aaa;
    }
    .mode-btn.active { background: #0078d4; color: white; }
    .btn-group {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    button.action-btn {
      background: #333; color: white; border: 1px solid #555;
      padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    button.action-btn:hover { background: #444; }
    .guide-box {
      background: rgba(0, 120, 212, 0.15); border-left: 3px solid #0078d4;
      padding: 8px 10px; margin-top: 8px; font-size: 12px; line-height: 1.5; color: #ddd;
    }
    .section-block {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #444;
    }
    .model-item {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px; background: rgba(255,255,255,0.06);
      padding: 6px 8px; border-radius: 4px;
    }
    .model-item label {
      display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1;
    }
    .fly-mini-btn {
      padding: 3px 8px; font-size: 11px; background: #2b88d8; border: none; color: white; border-radius: 3px; cursor: pointer; margin-left: 4px;
    }
    .fly-mini-btn.follow { background: #107c10; }
    .coord-text { font-family: monospace; font-size: 11px; color: #4fc3f7; display: block; }
    .status-note { font-size: 11px; color: #aaa; margin-bottom: 6px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="toolbar">
    <div style="font-size: 15px; font-weight: bold;">LiDAR 室內外空間導航檢視器</div>

    <!-- 導航模式切換 -->
    <div class="mode-switch">
      <button id="orbitModeBtn" class="mode-btn active">中心環繞視察 (Orbit)</button>
      <button id="fpvModeBtn" class="mode-btn">人眼第一人稱 (WASD)</button>
    </div>

    <div id="controlGuide" class="guide-box">
      <strong>中心視察模式：</strong><br>
      • <b>雙擊滑鼠左鍵</b>：將點擊位置設為旋轉中心並靠近<br>
      • <b>左鍵拖曳</b>：繞著中心點 360° 環顧四周<br>
      • <b>右鍵拖曳</b>：平行移動位置 ｜ <b>滾輪</b>：前後推拉
    </div>

    <div class="btn-group">
      <button id="topViewBtn" class="action-btn">一鍵俯視角</button>
      <button id="eyeLevelBtn" class="action-btn">切換人眼高度 (1.6m)</button>
      <button id="toggleBuildingsBtn" class="action-btn">外部建築透明度</button>
    </div>

    <!-- 樓層圖層控制 -->
    <div class="section-block" id="modelList">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-size: 12px; color: #aaa; font-weight:bold;">樓層圖層控制：</span>
        <label style="font-size:11px; color:#8ce99a; cursor:pointer; display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="autoSwitchFloorChk"> 隨 Robot 自動切樓層
        </label>
      </div>
    </div>

    <!-- Robot 即時監控與遠端 JSON 載入狀態 -->
    <div class="section-block">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-size: 12px; color: #aaa; font-weight:bold;">Robot 軌跡與即時位置：</span>
        <button id="reloadRoutesBtn" class="fly-mini-btn" style="background:#555;">重新載入 JSON</button>
      </div>
      <div class="status-note" id="routeLoadStatus">準備載入路徑 JSON...</div>
      <div id="robotList">
        <div style="font-size:11px; color:#777;">正在載入路徑 JSON...</div>
      </div>
    </div>
  </div>

  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IkZqU3ltVnAtUXJJeHJiX20iLCJqdGkiOiJjNGIzMjQ1ZS0xM2EyLTQ2NWMtYWYwOS1mYWUxOTMyZjllNmMiLCJpZCI6NTUyNjg2LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTUwODIzODd9.JEBZaZMgJZBqkYtDQ3qWukrTRelSvU5slfcznBTGd2Q';

    // =========================================================================
    // 【主要設定區】在此增減「樓層模型」、「預設 floorZ」與「Robot 路徑 JSON 網址」
    // defaultFloorZ：相對於該樓層模型中心的地板 Z 高度（公尺），若 JSON 內有 floorZ 會優先使用 JSON
    // =========================================================================
    const MODELS_CONFIG = [
      { name: '11/f', assetId: 6184026, show: true, defaultFloorZ: -1.5 },
      { name: '12/f', assetId: 6183954, show: true, defaultFloorZ: -1.5 },
      { name: '13/f', assetId: 6179670, show: true, defaultFloorZ: -1.5 }
    ];

    // 新增路徑時，直接在此陣列加上新的 .json 網址即可：
    const ROUTE_JSON_URLS = [
      'https://ku1311.github.io/ZpeederHK/robot/model_corridor_A_route.json',
      'https://ku1311.github.io/ZpeederHK/robot/model_corridor_B_route.json',
      'https://ku1311.github.io/ZpeederHK/robot/model_corridor_C_route.json'
    ];
    // =========================================================================

    const ROBOT_HEIGHT = 0.7;

    function extractFloorNumber(floorInput) {
      if (floorInput === undefined || floorInput === null) return null;
      const match = String(floorInput).match(/-?\d+/);
      return match ? parseInt(match[0], 10) : null;
    }

    async function init() {
      const viewer = new Cesium.Viewer('cesiumContainer', {
        terrain: Cesium.Terrain.fromWorldTerrain(),
        timeline: false,
        animation: false,
        selectionIndicator: false,
        infoBox: false
      });

      const scene = viewer.scene;
      const camera = viewer.camera;
      const controller = scene.screenSpaceCameraController;

      controller.enableCollisionDetection = false;
      controller.minimumZoomDistance = 0.1;
      controller.maximumZoomDistance = 5000;
      camera.frustum.near = 0.05;

      const osmBuildings = await Cesium.createOsmBuildingsAsync();
      osmBuildings.style = new Cesium.Cesium3DTileStyle({
        color: "color('white', 0.35)"
      });
      scene.primitives.add(osmBuildings);

      const modelListContainer = document.getElementById('modelList');
      const floorMap = {};
      const robots = {};
      const routeEntities = [];
      const activeSimulators = [];
      const loadedRouteKeys = new Set();
      let activeTileset = null;

      function syncRobotsVisibilityForFloor(floorNum, isVisible) {
        Object.values(robots).forEach(r => {
          if (r.floorNum === floorNum) r.entity.show = isVisible;
        });
        routeEntities.forEach(item => {
          if (item.floorNum === floorNum) item.entity.show = isVisible;
        });
      }

      for (const item of MODELS_CONFIG) {
        try {
          const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(item.assetId, {
            maximumScreenSpaceError: 4
          });
          tileset.show = item.show;
          scene.primitives.add(tileset);
          if (!activeTileset) activeTileset = tileset;

          const floorNum = extractFloorNumber(item.name);
          const center = tileset.boundingSphere.center.clone();
          const enuMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(center);

          const row = document.createElement('div');
          row.className = 'model-item';
          row.innerHTML = `
            <label>
              <input type="checkbox" ${item.show ? 'checked' : ''}>
              <span>${item.name}</span>
            </label>
            <button class="fly-mini-btn">定位</button>
          `;

          const checkboxEl = row.querySelector('input');
          checkboxEl.onchange = (e) => {
            const checked = e.target.checked;
            tileset.show = checked;
            if (floorNum !== null) syncRobotsVisibilityForFloor(floorNum, checked);
          };

          row.querySelector('button').onclick = () => {
            activeTileset = tileset;
            viewer.trackedEntity = undefined;
            viewer.camera.flyToBoundingSphere(tileset.boundingSphere, {
              offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), 15)
            });
          };
          modelListContainer.appendChild(row);

          if (floorNum !== null) {
            floorMap[floorNum] = {
              config: item,
              tileset: tileset,
              enuMatrix: enuMatrix,
              floorZ: item.defaultFloorZ !== undefined ? item.defaultFloorZ : -1.2,
              checkboxEl: checkboxEl
            };
          }
        } catch (error) {
          console.error(`載入模型 "${item.name}" 失敗:`, error);
        }
      }

      if (activeTileset) {
        await viewer.zoomTo(activeTileset, new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), 20));
      }

      // 穩定高度計算：使用 JSON 指定的 floorZ / waypoint.z 或樓層預設 defaultFloorZ，不再每幀重抓避免跳動
      function getStableFloorPosition(floorData, localX, localY, explicitZ) {
        const relativeFloorZ = (explicitZ !== undefined && explicitZ !== null)
          ? explicitZ
          : floorData.floorZ;

        const localPoint = new Cesium.Cartesian3(localX, localY, relativeFloorZ + (ROBOT_HEIGHT / 2));
        return Cesium.Matrix4.multiplyByPoint(floorData.enuMatrix, localPoint, new Cesium.Cartesian3());
      }

      const robotListContainer = document.getElementById('robotList');

      window.updateAutoXingRobot = function(axData) {
        const floorNum = extractFloorNumber(axData.floor);
        const floorData = floorMap[floorNum];
        if (!floorData) return;

        if (document.getElementById('autoSwitchFloorChk').checked) {
          Object.entries(floorMap).forEach(([fKey, fObj]) => {
            const shouldShow = (Number(fKey) === floorNum);
            if (fObj.tileset.show !== shouldShow) {
              fObj.tileset.show = shouldShow;
              fObj.checkboxEl.checked = shouldShow;
              syncRobotsVisibilityForFloor(Number(fKey), shouldShow);
            }
          });
        }

        const x = axData.pose.x;
        const y = axData.pose.y;
        const yawDeg = Cesium.Math.toDegrees(axData.pose.yaw || 0);
        const explicitZ = (axData.pose.z !== undefined && axData.pose.z !== null)
          ? axData.pose.z
          : floorData.floorZ;

        const worldPos = getStableFloorPosition(floorData, x, y, explicitZ);
        const hpr = new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(yawDeg), 0, 0);
        const orientation = Cesium.Transforms.headingPitchRollQuaternion(worldPos, hpr);

        const id = axData.robotId;
        const isFloorVisible = floorData.tileset.show;

        if (!robots[id]) {
          if (Object.keys(robots).length === 0) robotListContainer.innerHTML = '';

          const trailPositions = [worldPos];
          const entity = viewer.entities.add({
            id: id,
            name: id,
            show: isFloorVisible,
            position: worldPos,
            orientation: orientation,
            cylinder: {
              length: ROBOT_HEIGHT,
              topRadius: 0.32,
              bottomRadius: 0.35,
              material: Cesium.Color.CYAN.withAlpha(0.95),
              outline: true,
              outlineColor: Cesium.Color.WHITE
            },
            label: {
              text: `${id}\n${floorData.config.name} (${x.toFixed(1)}, ${y.toFixed(1)})`,
              font: '12px sans-serif',
              fillColor: Cesium.Color.WHITE,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              pixelOffset: new Cesium.Cartesian2(0, -34),
              disableDepthTestDistance: Number.POSITIVE_INFINITY
            },
            polyline: {
              positions: new Cesium.CallbackProperty(() => trailPositions, false),
              width: 3,
              material: Cesium.Color.CYAN.withAlpha(0.7)
            }
          });

          const row = document.createElement('div');
          row.className = 'model-item';
          row.innerHTML = `
            <div>
              <strong>${id}</strong> <span style="color:#8ce99a; font-size:11px;" id="flr-${id}">[${floorData.config.name}]</span>
              <span class="coord-text" id="coord-${id}">X:${x.toFixed(2)} Y:${y.toFixed(2)} Z:${explicitZ.toFixed(2)}</span>
            </div>
            <div>
              <button class="fly-mini-btn" id="fly-${id}">定位</button>
              <button class="fly-mini-btn follow" id="follow-${id}">跟隨</button>
            </div>
          `;
          robotListContainer.appendChild(row);

          document.getElementById(`fly-${id}`).onclick = () => {
            if (!floorData.tileset.show) {
              floorData.tileset.show = true;
              floorData.checkboxEl.checked = true;
              syncRobotsVisibilityForFloor(floorNum, true);
            }
            viewer.trackedEntity = undefined;
            viewer.flyTo(entity, { offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-30), 5) });
          };

          document.getElementById(`follow-${id}`).onclick = () => {
            setNavigationMode(false);
            viewer.trackedEntity = entity;
          };

          robots[id] = { entity, trailPositions, floorNum };
        } else {
          const r = robots[id];
          if (r.floorNum !== floorNum) {
            r.trailPositions.length = 0;
            r.floorNum = floorNum;
          }
          r.entity.show = isFloorVisible;
          r.entity.position = worldPos;
          r.entity.orientation = orientation;
          r.entity.label.text = `${id}\n${floorData.config.name} (${x.toFixed(1)}, ${y.toFixed(1)})`;

          r.trailPositions.push(worldPos);
          if (r.trailPositions.length > 120) r.trailPositions.shift();

          const coordEl = document.getElementById(`coord-${id}`);
          const flrEl = document.getElementById(`flr-${id}`);
          if (coordEl) coordEl.innerText = `X:${x.toFixed(2)} Y:${y.toFixed(2)} Z:${explicitZ.toFixed(2)}`;
          if (flrEl) flrEl.innerText = `[${floorData.config.name}]`;
        }
      };

      async function loadAndRunRouteJson(routeJson, uniqueKey) {
        if (uniqueKey && loadedRouteKeys.has(uniqueKey)) return;

        const floorNum = extractFloorNumber(routeJson.floor);
        const floorData = floorMap[floorNum];
        if (!floorData) {
          console.warn(`JSON 樓層 (${routeJson.floor}) 找不到對應的 MODELS_CONFIG 設定`);
          return;
        }
        if (!routeJson.waypoints || routeJson.waypoints.length < 2) {
          console.warn('JSON waypoints 至少需要 2 個點');
          return;
        }

        if (uniqueKey) loadedRouteKeys.add(uniqueKey);

        // 若 JSON 有提供 floorZ，更新該樓層的基準高度
        const routeFloorZ = (routeJson.floorZ !== undefined && routeJson.floorZ !== null)
          ? routeJson.floorZ
          : floorData.floorZ;

        const pathWorldPositions = routeJson.waypoints.map(pt => {
          const ptZ = (pt.z !== undefined && pt.z !== null) ? pt.z : routeFloorZ;
          return getStableFloorPosition(floorData, pt.x, pt.y, ptZ);
        });
        if (routeJson.loopMode === 'loop') {
          pathWorldPositions.push(pathWorldPositions[0]);
        }

        const routeLineEntity = viewer.entities.add({
          show: floorData.tileset.show,
          polyline: {
            positions: pathWorldPositions,
            width: 3,
            material: new Cesium.PolylineDashMaterialProperty({ color: Cesium.Color.YELLOW.withAlpha(0.85) })
          }
        });
        routeEntities.push({ floorNum, entity: routeLineEntity });

        let pts = [...routeJson.waypoints];
        if (routeJson.loopMode === 'pingpong' && pts.length > 2) {
          pts = pts.concat(pts.slice(1, -1).reverse());
        }

        activeSimulators.push({
          robotId: routeJson.robotId || 'AX_ROBOT_001',
          floor: floorNum,
          floorZ: routeFloorZ,
          speed: routeJson.speed || 0.8,
          loopMode: routeJson.loopMode || 'loop',
          pts: pts,
          segIdx: 0,
          segDist: 0
        });
      }

      async function loadHardcodedRoutes() {
        const statusEl = document.getElementById('routeLoadStatus');
        let successCount = 0;
        const failedUrls = [];

        for (const url of ROUTE_JSON_URLS) {
          try {
            const res = await fetch(`${url}${url.includes('?') ? '&' : '?'}t=${Date.now()}`);
            if (!res.ok) {
              failedUrls.push(url.split('/').pop());
              continue;
            }
            const data = await res.json();
            const routesArray = Array.isArray(data) ? data : [data];
            for (let i = 0; i < routesArray.length; i++) {
              await loadAndRunRouteJson(routesArray[i], `${url}#${i}`);
              successCount++;
            }
          } catch (err) {
            failedUrls.push(url.split('/').pop());
            console.warn(`載入路徑 JSON 失敗 (${url}):`, err);
          }
        }

        let statusText = `已載入 ${successCount}/${ROUTE_JSON_URLS.length} 條路徑`;
        if (failedUrls.length > 0) {
          statusText += `（未找到或失敗：${failedUrls.join(', ')}）`;
        }
        statusEl.textContent = statusText;

        if (successCount === 0 && Object.keys(robots).length === 0) {
          robotListContainer.innerHTML = `<div style="font-size:11px; color:#f48771;">目前沒有成功載入任何路徑 JSON，請確認遠端檔案是否已上傳。</div>`;
        }
      }

      await loadHardcodedRoutes();
      document.getElementById('reloadRoutesBtn').onclick = () => loadHardcodedRoutes();

      setInterval(() => {
        const dt = 0.1;
        for (const sim of activeSimulators) {
          if (sim.loopMode === 'once' && sim.segIdx >= sim.pts.length - 1) continue;

          const p1 = sim.pts[sim.segIdx];
          const nextIdx = (sim.segIdx + 1) % sim.pts.length;
          const p2 = sim.pts[nextIdx];

          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const len = Math.hypot(dx, dy);
          if (len < 0.001) { sim.segIdx = nextIdx; continue; }

          sim.segDist += sim.speed * dt;
          if (sim.segDist >= len) {
            sim.segDist -= len;
            sim.segIdx = nextIdx;
            continue;
          }

          const ratio = sim.segDist / len;
          const z1 = (p1.z !== undefined && p1.z !== null) ? p1.z : sim.floorZ;
          const z2 = (p2.z !== undefined && p2.z !== null) ? p2.z : sim.floorZ;

          window.updateAutoXingRobot({
            robotId: sim.robotId,
            floor: sim.floor,
            pose: {
              x: p1.x + dx * ratio,
              y: p1.y + dy * ratio,
              z: z1 + (z2 - z1) * ratio,
              yaw: Math.atan2(dy, dx)
            }
          });
        }
      }, 100);

      const mockChannel = new BroadcastChannel('autoxing_mock_telemetry');
      mockChannel.onmessage = (event) => window.updateAutoXingRobot(event.data);

      // ==========================================
      // 導航控制（雙擊中心環繞 + WASD 第一人稱）
      // ==========================================
      let pivotMarker = null;
      const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);

      handler.setInputAction((movement) => {
        if (isFpvMode) return;
        viewer.trackedEntity = undefined;
        const pickedPosition = scene.pickPosition(movement.position);
        if (Cesium.defined(pickedPosition)) {
          if (pivotMarker) viewer.entities.remove(pivotMarker);
          pivotMarker = viewer.entities.add({
            position: pickedPosition,
            point: { pixelSize: 10, color: Cesium.Color.LIME, outlineColor: Cesium.Color.BLACK, outlineWidth: 2 }
          });
          camera.flyToBoundingSphere(new Cesium.BoundingSphere(pickedPosition, 1.0), {
            duration: 0.8,
            offset: new Cesium.HeadingPitchRange(camera.heading, Cesium.Math.toRadians(-15), 3.5)
          });
        }
      }, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

      let isFpvMode = false;
      const flags = { moveForward: false, moveBackward: false, moveLeft: false, moveRight: false, moveUp: false, moveDown: false, look: false };
      let startMousePosition, mousePosition;

      function setNavigationMode(fpv) {
        isFpvMode = fpv;
        if (fpv) viewer.trackedEntity = undefined;
        document.getElementById('orbitModeBtn').classList.toggle('active', !fpv);
        document.getElementById('fpvModeBtn').classList.toggle('active', fpv);

        controller.enableRotate = !fpv;
        controller.enableTranslate = !fpv;
        controller.enableZoom = !fpv;
        controller.enableTilt = !fpv;
        controller.enableLook = !fpv;

        if (fpv) {
          if (pivotMarker) viewer.entities.remove(pivotMarker);
          camera.setView({ orientation: { heading: camera.heading, pitch: 0.0, roll: 0.0 } });
          document.getElementById('controlGuide').innerHTML = `
            <strong>人眼第一人稱模式（已鎖定平視）：</strong><br>
            • <b>W / S</b>：前進 / 後退 ｜ <b>A / D</b>：左移 / 右移<br>
            • <b>Q / E</b>：升高 / 降低視線高度<br>
            • <b>按住左鍵拖曳</b>：原地轉頭環顧四周
          `;
        } else {
          document.getElementById('controlGuide').innerHTML = `
            <strong>中心視察模式：</strong><br>
            • <b>雙擊滑鼠左鍵</b>：將點擊位置設為旋轉中心並靠近<br>
            • <b>左鍵拖曳</b>：繞著中心點 360° 環顧四周<br>
            • <b>右鍵拖曳</b>：平行移動位置 ｜ <b>滾輪</b>：前後推拉
          `;
        }
      }

      document.getElementById('orbitModeBtn').onclick = () => setNavigationMode(false);
      document.getElementById('fpvModeBtn').onclick = () => setNavigationMode(true);

      handler.setInputAction((m) => {
        if (!isFpvMode) return;
        flags.look = true;
        mousePosition = startMousePosition = Cesium.Cartesian3.clone(m.position);
      }, Cesium.ScreenSpaceEventType.LEFT_DOWN);
      handler.setInputAction((m) => { if (isFpvMode && flags.look) mousePosition = m.endPosition; }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
      handler.setInputAction(() => { flags.look = false; }, Cesium.ScreenSpaceEventType.LEFT_UP);

      document.addEventListener('keydown', (e) => {
        if (!isFpvMode) return;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') flags.moveForward = true;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') flags.moveBackward = true;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') flags.moveLeft = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') flags.moveRight = true;
        if (e.code === 'KeyE') flags.moveUp = true;
        if (e.code === 'KeyQ') flags.moveDown = true;
      });
      document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW' || e.code === 'ArrowUp') flags.moveForward = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') flags.moveBackward = false;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') flags.moveLeft = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') flags.moveRight = false;
        if (e.code === 'KeyE') flags.moveUp = false;
        if (e.code === 'KeyQ') flags.moveDown = false;
      });

      viewer.clock.onTick.addEventListener(() => {
        if (!isFpvMode) return;
        if (flags.look) {
          const width = scene.canvas.clientWidth;
          const height = scene.canvas.clientHeight;
          const x = (mousePosition.x - startMousePosition.x) / width;
          const y = -(mousePosition.y - startMousePosition.y) / height;
          camera.setView({
            orientation: {
              heading: camera.heading + x * 0.75,
              pitch: Cesium.Math.clamp(camera.pitch + y * 0.5, Cesium.Math.toRadians(-85), Cesium.Math.toRadians(85)),
              roll: 0.0
            }
          });
        }
        const walkSpeed = 0.08;
        const transform = Cesium.Transforms.eastNorthUpToFixedFrame(camera.positionWC);
        const h = camera.heading;
        const worldForward = Cesium.Matrix4.multiplyByPointAsVector(transform, new Cesium.Cartesian3(Math.sin(h), Math.cos(h), 0), new Cesium.Cartesian3());
        const worldRight = Cesium.Matrix4.multiplyByPointAsVector(transform, new Cesium.Cartesian3(Math.cos(h), -Math.sin(h), 0), new Cesium.Cartesian3());

        if (flags.moveForward) camera.move(worldForward, walkSpeed);
        if (flags.moveBackward) camera.move(worldForward, -walkSpeed);
        if (flags.moveRight) camera.move(worldRight, walkSpeed);
        if (flags.moveLeft) camera.move(worldRight, -walkSpeed);
        if (flags.moveUp) camera.moveUp(walkSpeed);
        if (flags.moveDown) camera.moveDown(walkSpeed);
      });

      document.getElementById('topViewBtn').onclick = () => {
        setNavigationMode(false);
        viewer.trackedEntity = undefined;
        if (!activeTileset) return;
        viewer.camera.flyToBoundingSphere(activeTileset.boundingSphere, {
          offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-90), Math.max(activeTileset.boundingSphere.radius * 2.5, 25))
        });
      };

      document.getElementById('eyeLevelBtn').onclick = () => {
        if (!activeTileset) return;
        viewer.trackedEntity = undefined;
        camera.flyToBoundingSphere(activeTileset.boundingSphere, {
          duration: 1.0,
          offset: new Cesium.HeadingPitchRange(0, 0, 1.5),
          complete: () => setNavigationMode(true)
        });
      };

      let isTransparent = true;
      document.getElementById('toggleBuildingsBtn').onclick = () => {
        isTransparent = !isTransparent;
        osmBuildings.style = new Cesium.Cesium3DTileStyle({
          color: isTransparent ? "color('white', 0.35)" : "color('white', 0.0)"
        });
      };
    }

    init();
  </script>
</body>
</html>
