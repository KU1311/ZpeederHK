<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文單字卡庫</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --badge-bg: #e0f2fe;
      --badge-text: #0369a1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.5; }
    
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; color: var(--text-main); }

    /* 控制面板 & 篩選器 */
    .control-panel {
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .filter-group { display: flex; align-items: center; gap: 10px; }
    select { padding: 8px 12px; font-size: 15px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; cursor: pointer; }

    .btn-group { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-outline { background-color: transparent; border: 1px solid #cbd5e1; color: var(--text-main); }
    .btn-outline:hover { background-color: #f1f5f9; }
    .btn-active { background-color: #334155; color: white; border-color: #334155; }

    /* 語音播放按鈕 */
    .btn-speech {
      background: #f1f5f9;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-speech:hover { background: #e2e8f0; transform: scale(1.05); }
    .btn-speech:active { transform: scale(0.95); }

    /* 標籤類別 Badge */
    .badge {
      display: inline-block;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 600;
    }

    /* 模式 1: 全部列出 (網格卡片 View) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-jp { font-size: 1.5rem; font-weight: bold; color: var(--text-main); margin-bottom: 4px; }
    .card-romaji { font-size: 0.95rem; color: var(--primary-color); font-style: italic; margin-bottom: 12px; word-break: break-word; }
    .card-zh { font-size: 1.1rem; color: #334155; margin-bottom: 8px; font-weight: 500; }
    .card-note { font-size: 0.85rem; color: var(--text-sub); background: #f1f5f9; padding: 6px 10px; border-radius: 6px; margin-top: 8px; }

    /* 模式 2: 隨機單張大卡片 View */
    .random-view {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    .single-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 450px;
      border-radius: 16px;
      padding: 35px 25px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
      text-align: center;
      position: relative;
    }

    .single-card .card-jp { font-size: 2.5rem; margin-bottom: 8px; }
    .single-card .card-romaji { font-size: 1.2rem; margin-bottom: 20px; word-break: break-word; }
    .single-card .card-zh { font-size: 1.6rem; color: #0f172a; margin-bottom: 15px; }
    .single-card .card-note { display: inline-block; text-align: left; max-width: 100%; }
    .single-card .btn-speech { width: 48px; height: 48px; font-size: 1.4rem; margin: 0 auto 15px auto; }

    .action-group { margin-top: 20px; }

    .loading-text { text-align: center; grid-column: 1 / -1; color: var(--text-sub); padding: 40px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>日文單字卡庫</h1>

    <!-- 控制面板 (分類篩選與模式切換) -->
    <div class="control-panel">
      <div class="filter-group">
        <label for="categoryFilter"><strong>類別：</strong></label>
        <select id="categoryFilter" onchange="handleFilterChange()">
          <option value="ALL">載入中...</option>
        </select>
      </div>

      <div class="btn-group">
        <button id="btnAllView" class="btn btn-outline btn-active" onclick="switchView('all')">全部卡片</button>
        <button id="btnRandomView" class="btn btn-outline" onclick="switchView('random')">🎲 隨機抽卡</button>
      </div>
    </div>

    <!-- 視圖 1: 全部列出 (卡片網格) -->
    <div id="allCardsGrid" class="cards-grid">
      <div class="loading-text">正在讀取 Google Sheet 資料...</div>
    </div>

    <!-- 視圖 2: 隨機單卡展示 -->
    <div id="randomCardView" class="random-view">
      <div id="singleCardContainer" class="single-card">
        <!-- 隨機卡片動態渲染位置 -->
      </div>
      <div class="action-group">
        <button class="btn btn-primary" style="padding: 12px 28px; font-size: 16px;" onclick="drawRandomCard()">下一張 🎲</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 請填入你在 Google Sheet「發布到網路」獲得的 CSV 連結
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrNbrgg5xEkn-gVgMAUOM0Lw8eYgJ4oCZBJ7ApUPjk1Ar0ZCTMo2OF_lgnUPSwKsPF2zb8EWbPzmB1/pub?output=csv";

    let allData = [];
    let currentFilteredData = [];
    let currentMode = 'all';

    window.onload = function() {
      fetchCSVData();
    };

    // 發音朗讀功能 (Web Speech API)
    function speakJapanese(text) {
      if (!('speechSynthesis' in window)) {
        alert("您的瀏覽器不支援語音播放功能。");
        return;
      }
      
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    // 從 Google Sheet 發布的 CSV 讀取資料
    function fetchCSVData() {
      fetch(csvUrl)
        .then(res => {
          if (!res.ok) throw new Error("網絡回應失敗");
          return res.text();
        })
        .then(text => {
          parseCSV(text);
        })
        .catch(err => {
          console.error(err);
          document.getElementById("allCardsGrid").innerHTML = 
            '<div class="loading-text" style="color:red;">資料載入失敗，請檢查 CSV 連結是否正確。</div>';
        });
    }

    // 依據 CSV 規格精確解析單行（正確處置帶有逗號或雙引號包裹的字串）
    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result.map(col => col.replace(/^"|"$/g, '').replace(/""/g, '"'));
    }

    // 解析 CSV 內容
    function parseCSV(text) {
      const lines = text.split(/\r\n|\n/);
      allData = [];

      for (let i = 1; i < lines.length; i++) { // 跳過表頭
        if (!lines[i].trim()) continue;

        const cleanCols = parseCSVLine(lines[i]);

        if (cleanCols.length >= 2) {
          allData.push({
            japanese:  cleanCols[1] || '',
            romaji:    cleanCols[2] || '', // 精確保留整段羅馬拼音 (包含空格)
            chinese:   cleanCols[3] || '',
            note:      cleanCols[4] || '',
            category:  cleanCols[5] || '未分類'
          });
        }
      }

      currentFilteredData = [...allData];
      populateCategories();
      renderAllCards(currentFilteredData);
    }

    // 建置類別下拉選單
    function populateCategories() {
      const categorySelect = document.getElementById("categoryFilter");
      const categories = new Set();

      allData.forEach(item => {
        if (item.category) categories.add(item.category);
      });

      categorySelect.innerHTML = '<option value="ALL">全部類別</option>';
      categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      });
    }

    // 處理類別篩選器變更
    function handleFilterChange() {
      const selected = document.getElementById("categoryFilter").value;
      if (selected === "ALL") {
        currentFilteredData = [...allData];
      } else {
        currentFilteredData = allData.filter(item => item.category === selected);
      }

      if (currentMode === 'all') {
        renderAllCards(currentFilteredData);
      } else {
        drawRandomCard();
      }
    }

    // 安全字串轉義
    function escapeText(text) {
      return text.replace(/'/g, "\\'");
    }

    // 渲染「全部卡片」列表
    function renderAllCards(data) {
      const grid = document.getElementById("allCardsGrid");
      grid.innerHTML = "";

      if (data.length === 0) {
        grid.innerHTML = '<div class="loading-text">目前沒有符合該類別的卡片。</div>';
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="badge">${item.category}</span>
              <button class="btn-speech" title="朗讀日文" onclick="speakJapanese('${escapeText(item.japanese)}')">🔊</button>
            </div>
            <div class="card-jp">${item.japanese}</div>
            <div class="card-romaji">${item.romaji}</div>
            <div class="card-zh">${item.chinese}</div>
            ${item.note ? `<div class="card-note">💡 ${item.note}</div>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 抽取並顯示隨機卡片
    function drawRandomCard() {
      const container = document.getElementById("singleCardContainer");

      if (currentFilteredData.length === 0) {
        container.innerHTML = '<div class="loading-text">目前類別沒有可抽取的卡片。</div>';
        return;
      }

      const randomIndex = Math.floor(Math.random() * currentFilteredData.length);
      const item = currentFilteredData[randomIndex];

      container.innerHTML = `
        <div class="card-header" style="justify-content: center; margin-bottom: 15px;">
          <span class="badge">${item.category}</span>
        </div>
        <button class="btn-speech" title="朗讀日文" onclick="speakJapanese('${escapeText(item.japanese)}')">🔊</button>
        <div class="card-jp">${item.japanese}</div>
        <div class="card-romaji">${item.romaji}</div>
        <div class="card-zh">${item.chinese}</div>
        ${item.note ? `<div class="card-note">💡 ${item.note}</div>` : ''}
      `;
    }

    // 切換模式
    function switchView(mode) {
      currentMode = mode;
      const allGrid = document.getElementById("allCardsGrid");
      const randomView = document.getElementById("randomCardView");
      const btnAll = document.getElementById("btnAllView");
      const btnRandom = document.getElementById("btnRandomView");

      if (mode === 'all') {
        allGrid.style.display = 'grid';
        randomView.style.display = 'none';
        btnAll.classList.add('btn-active');
        btnRandom.classList.remove('btn-active');
        renderAllCards(currentFilteredData);
      } else {
        allGrid.style.display = 'none';
        randomView.style.display = 'flex';
        btnAll.classList.remove('btn-active');
        btnRandom.classList.add('btn-active');
        drawRandomCard();
      }
    }
  </script>
</body>
</html>
