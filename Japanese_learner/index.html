<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文單字卡庫</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; line-height: 1.6; color: #333; }
    h2 { margin-bottom: 15px; }
    .control-panel { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
    select { padding: 8px 12px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; background-color: #fff; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; }
    th { background-color: #f4f6f8; font-weight: bold; }
    tr:nth-child(even) { background-color: #fafafa; }
    .badge { background-color: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 12px; font-size: 0.85em; font-weight: 600; display: inline-block; }
    .loading { color: #666; font-style: italic; }
  </style>
</head>
<body>

  <h2>日文單字卡庫</h2>

  <!-- 類別篩選器 Filter -->
  <div class="control-panel">
    <label for="categoryFilter"><strong>篩選類別：</strong></label>
    <select id="categoryFilter" onchange="filterData()">
      <option value="ALL">載入中...</option>
    </select>
  </div>

  <!-- 資料展示表格 -->
  <table>
    <thead>
      <tr>
        <th>類別</th>
        <th>日文</th>
        <th>羅馬拼音</th>
        <th>中文意思</th>
        <th>備註</th>
        <th>時間戳記</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="6" class="loading">正在連線至 Google Sheet 讀取資料...</td></tr>
    </tbody>
  </table>

  <script>
    // ⚠️ 請將下方的網址替換為你在 Google Sheet「發布到網路」獲取的 CSV 連結
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrNbrgg5xEkn-gVgMAUOM0Lw8eYgJ4oCZBJ7ApUPjk1Ar0ZCTMo2OF_lgnUPSwKsPF2zb8EWbPzmB1/pub?output=csv";

    let allData = [];

    // 網頁載入後自動向 Google Sheet 抓取 CSV
    window.onload = function() {
      fetchCSVData();
    };

    function fetchCSVData() {
      fetch(csvUrl)
        .then(response => {
          if (!response.ok) throw new Error("無法讀取 CSV 資料");
          return response.text();
        })
        .then(text => {
          parseCSV(text);
        })
        .catch(error => {
          console.error(error);
          document.getElementById("tableBody").innerHTML = 
            '<tr><td colspan="6" style="color:red;">資料載入失敗，請確認 Google Sheet 發布連結是否正確。</td></tr>';
        });
    }

    // 解析 CSV 格式資料 (處理 CSV 雙引號與換行)
    function parseCSV(text) {
      const lines = text.split(/\r\n|\n/);
      allData = [];

      for (let i = 1; i < lines.length; i++) { // 跳過第 0 列標題列
        if (!lines[i].trim()) continue;

        // 正則表達式安全拆分逗號 (防止備註或欄位內含逗號導致列變形)
        const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');

        // 清除欄位首尾的雙引號
        const cleanCols = cols.map(col => col ? col.replace(/^"|"$/g, '').trim() : '');

        if (cleanCols.length >= 2) {
          allData.push({
            timestamp: cleanCols[0] || '', // A欄: 時間戳記
            japanese:  cleanCols[1] || '', // B欄: 日文
            romaji:    cleanCols[2] || '', // C欄: 羅馬拼音
            chinese:   cleanCols[3] || '', // D欄: 中文意思
            note:      cleanCols[4] || '', // E欄: 備註
            category:  cleanCols[5] || '未分類' // F欄: 類別
          });
        }
      }

      populateCategories();
      renderTable(allData);
    }

    // 自動抓取 CSV 裡的所有類別並建立下拉選單
    function populateCategories() {
      const categorySelect = document.getElementById("categoryFilter");
      const categories = new Set();

      allData.forEach(item => {
        if (item.category) categories.add(item.category);
      });

      categorySelect.innerHTML = '<option value="ALL">全部類別</option>';
      categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    // 渲染表格內容
    function renderTable(dataToDisplay) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (dataToDisplay.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">沒有符合該類別的資料</td></tr>';
        return;
      }

      dataToDisplay.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="badge">${row.category || '未分類'}</span></td>
          <td><strong>${row.japanese}</strong></td>
          <td>${row.romaji}</td>
          <td>${row.chinese}</td>
          <td>${row.note}</td>
          <td><small style="color:#888;">${row.timestamp}</small></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 執行 Filter 篩選
    function filterData() {
      const selectedCategory = document.getElementById("categoryFilter").value;

      if (selectedCategory === "ALL") {
        renderTable(allData);
      } else {
        const filtered = allData.filter(item => item.category === selectedCategory);
        renderTable(filtered);
      }
    }
  </script>

</body>
</html>
