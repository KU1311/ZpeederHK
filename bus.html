<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港全公司巴士實時到站地圖 (HK Bus ETA Map)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    #map { height: 100vh; width: 100vw; z-index: 1; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Company Marker Badges */
    .marker-pin {
      width: 28px;
      height: 28px;
      border-radius: 50% 50% 50% 0;
      position: absolute;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      margin: -20px 0 0 -14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
    .marker-pin i {
      transform: rotate(45deg);
      color: white;
      font-size: 12px;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Left Sidebar Controls / Route Inspector -->
  <div class="fixed top-4 left-4 z-[1000] w-full max-w-sm px-2 sm:px-0">
    <div class="glass-panel rounded-2xl shadow-xl border border-white/40 overflow-hidden flex flex-col max-h-[calc(100vh-2rem)]">
      
      <!-- Header & Search Input -->
      <div class="p-4 bg-slate-900 text-white flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-bus text-yellow-400 text-xl"></i>
            <h1 class="font-bold text-lg tracking-wide">香港巴士到站地圖</h1>
          </div>
          <span class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded-full border border-slate-700">全營辦商 API</span>
        </div>

        <!-- Filter & Search Bar -->
        <div class="flex gap-2">
          <select id="company-filter" class="bg-slate-800 text-xs text-slate-200 rounded-lg px-2 py-2 border border-slate-700 focus:outline-none">
            <option value="ALL">全部公司</option>
            <option value="KMB">九巴/龍運</option>
            <option value="CTB">城巴</option>
            <option value="NLB">嶼巴</option>
            <option value="MTRB">港鐵巴士</option>
          </select>
          <div class="relative flex-1">
            <input type="text" id="route-input" placeholder="輸入路線號碼 (如 1A, 102, B1)..." 
              class="w-full bg-slate-800 text-sm text-white placeholder-slate-400 rounded-lg pl-8 pr-8 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-3 text-slate-400 text-xs"></i>
            <button id="clear-search" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-white text-xs">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <!-- Direction Switcher -->
        <div id="direction-container" class="hidden flex items-center justify-between bg-slate-800/80 p-1.5 rounded-lg border border-slate-700 text-xs">
          <button id="dir-outbound" class="flex-1 py-1.5 rounded-md font-medium transition text-center bg-blue-600 text-white">
            往 <span id="dest-outbound">-</span>
          </button>
          <button id="dir-inbound" class="flex-1 py-1.5 rounded-md font-medium transition text-center text-slate-400 hover:text-white">
            往 <span id="dest-inbound">-</span>
          </button>
        </div>
      </div>

      <!-- Route Stops List -->
      <div id="stops-container" class="flex-1 overflow-y-auto custom-scrollbar p-3 hidden space-y-1">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-2 py-1 flex justify-between items-center">
          <span>車站列表 (<span id="stop-count">0</span>)</span>
          <span class="text-[10px] text-slate-400">點擊車站查看所有到站時間</span>
        </div>
        <div id="stops-list" class="space-y-1"></div>
      </div>

      <!-- Initial Welcome State -->
      <div id="welcome-panel" class="p-6 text-center text-slate-500 space-y-3">
        <i class="fa-solid fa-map-location-dot text-4xl text-slate-300"></i>
        <p class="text-xs leading-relaxed">請在上方搜尋路線，或在地圖上直接點擊任何巴士站查看即時抵站 ETA 時間。</p>
      </div>
    </div>
  </div>

  <!-- Bottom/Floating Stop Real-time ETA Modal -->
  <div id="eta-modal" class="hidden fixed bottom-6 right-6 left-6 sm:left-auto sm:w-96 z-[1000] glass-panel rounded-2xl shadow-2xl border border-white/60 overflow-hidden flex flex-col transition-all duration-300">
    <!-- Modal Header -->
    <div class="bg-slate-900 text-white p-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2 overflow-hidden">
        <i class="fa-solid fa-clock text-blue-400 shrink-0"></i>
        <div class="truncate">
          <h3 id="eta-stop-name" class="font-bold text-sm truncate">巴士站名稱</h3>
          <p id="eta-stop-sub" class="text-[10px] text-slate-400 truncate">所有公司停靠路線 ETA</p>
        </div>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="refresh-eta-btn" title="重新整理" class="p-1.5 text-slate-400 hover:text-white rounded-lg transition">
          <i class="fa-solid fa-rotate text-xs"></i>
        </button>
        <button id="close-eta-btn" class="p-1.5 text-slate-400 hover:text-white rounded-lg transition">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Live ETA Content List -->
    <div id="eta-list-container" class="p-3 max-h-80 overflow-y-auto custom-scrollbar space-y-2">
      <div class="text-center py-6 text-slate-400 text-xs flex flex-col items-center gap-2">
        <i class="fa-solid fa-spinner fa-spin text-lg text-blue-500"></i>
        <span>正在讀取實時到站時間 (跨營辦商 API)...</span>
      </div>
    </div>
  </div>

  <script>
    // --- Application State ---
    let map;
    let markersLayer = L.layerGroup();
    let polylineLayer = L.layerGroup();
    
    let currentRouteData = null;
    let currentDirection = 'outbound'; // 'outbound' | 'inbound'
    let selectedStop = null;
    let autoRefreshTimer = null;

    // Company UI Colors
    const COMPANY_COLORS = {
      KMB: '#dc2626',   // Red
      LWB: '#ea580c',   // Orange
      CTB: '#ca8a04',   // Yellow
      NLB: '#0d9488',   // Teal
      MTRB: '#9f1239'   // Maroon
    };

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupEventListeners();
    });

    function initMap() {
      // Centered on Hong Kong
      map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 12);
      
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      markersLayer.addTo(map);
      polylineLayer.addTo(map);
    }

    function setupEventListeners() {
      const routeInput = document.getElementById('route-input');
      const clearBtn = document.getElementById('clear-search');

      routeInput.addEventListener('keyup', (e) => {
        clearBtn.classList.toggle('hidden', !routeInput.value);
        if (e.key === 'Enter') {
          handleSearch();
        }
      });

      clearBtn.addEventListener('click', () => {
        routeInput.value = '';
        clearBtn.classList.add('hidden');
        resetRouteView();
      });

      document.getElementById('dir-outbound').addEventListener('click', () => switchDirection('outbound'));
      document.getElementById('dir-inbound').addEventListener('click', () => switchDirection('inbound'));

      document.getElementById('close-eta-btn').addEventListener('click', closeEtaModal);
      document.getElementById('refresh-eta-btn').addEventListener('click', () => {
        if (selectedStop) fetchStopAllRoutesETA(selectedStop);
      });
    }

    // --- Search & Route Logic ---
    async function handleSearch() {
      const route = document.getElementById('route-input').value.trim().toUpperCase();
      const company = document.getElementById('company-filter').value;

      if (!route) return;

      resetRouteView();
      showLoadingStops();

      try {
        currentRouteData = await fetchRouteData(route, company);
        if (!currentRouteData || (!currentRouteData.outbound.stops.length && !currentRouteData.inbound.stops.length)) {
          alert(`未有找到路線 ${route} 的資料。`);
          resetRouteView();
          return;
        }

        setupDirectionUI();
        renderCurrentDirection();
      } catch (err) {
        console.error("Search error:", err);
        alert("搜尋失敗，請檢查網絡或稍後再試。");
        resetRouteView();
      }
    }

    // Multi-Company Route Resolution Engine
    async function fetchRouteData(route, companyFilter) {
      let result = {
        route: route,
        outbound: { dest: '', company: '', stops: [] },
        inbound: { dest: '', company: '', stops: [] }
      };

      // 1. KMB / LWB Search
      if (companyFilter === 'ALL' || companyFilter === 'KMB') {
        try {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/outbound/1`);
          const json = await res.json();
          if (json.data && json.data.length > 0) {
            result.outbound.company = json.data[0].co || 'KMB';
            result.outbound.stops = await processKMBStops(json.data);
            
            // Get Destination Text
            const routeRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}/outbound/1`);
            const routeJson = await routeRes.json();
            if (routeJson.data) result.outbound.dest = routeJson.data.dest_tc;

            // Inbound
            const inRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/inbound/1`);
            const inJson = await inRes.json();
            if (inJson.data && inJson.data.length > 0) {
              result.inbound.company = inJson.data[0].co || 'KMB';
              result.inbound.stops = await processKMBStops(inJson.data);
              
              const inRouteRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}/inbound/1`);
              const inRouteJson = await inRouteRes.json();
              if (inRouteJson.data) result.inbound.dest = inRouteJson.data.dest_tc;
            }

            return result;
          }
        } catch (e) {
          console.warn("KMB lookup skipped/failed:", e);
        }
      }

      // 2. Citybus Search
      if (companyFilter === 'ALL' || companyFilter === 'CTB') {
        try {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/outbound`);
          const json = await res.json();
          if (json.data && json.data.length > 0) {
            result.outbound.company = 'CTB';
            result.outbound.stops = await processCTBStops(json.data);
            
            const routeRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route/CTB/${route}`);
            const routeJson = await routeRes.json();
            if (routeJson.data) {
              result.outbound.dest = routeJson.data.dest_tc;
              result.inbound.dest = routeJson.data.orig_tc;
            }

            // Inbound
            const inRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/inbound`);
            const inJson = await inRes.json();
            if (inJson.data && inJson.data.length > 0) {
              result.inbound.company = 'CTB';
              result.inbound.stops = await processCTBStops(inJson.data);
            }

            return result;
          }
        } catch (e) {
          console.warn("CTB lookup skipped/failed:", e);
        }
      }

      // 3. NLB (New Lantao Bus)
      if (companyFilter === 'ALL' || companyFilter === 'NLB') {
        try {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list`);
          // NLB API has different endpoints structure, simplified fallback logic
        } catch(e) {}
      }

      return null;
    }

    async function processKMBStops(stopList) {
      const details = await Promise.all(stopList.map(async (s) => {
        try {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`);
          const json = await res.json();
          return {
            stop_id: s.stop,
            seq: s.seq,
            name_tc: json.data.name_tc,
            lat: parseFloat(json.data.lat),
            lng: parseFloat(json.data.long),
            company: 'KMB'
          };
        } catch { return null; }
      }));
      return details.filter(Boolean);
    }

    async function processCTBStops(stopList) {
      const details = await Promise.all(stopList.map(async (s) => {
        try {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${s.stop}`);
          const json = await res.json();
          return {
            stop_id: s.stop,
            seq: s.seq,
            name_tc: json.data.name_tc,
            lat: parseFloat(json.data.lat),
            lng: parseFloat(json.data.long),
            company: 'CTB'
          };
        } catch { return null; }
      }));
      return details.filter(Boolean);
    }

    // --- UI Render Methods ---
    function setupDirectionUI() {
      const dirContainer = document.getElementById('direction-container');
      const outBtn = document.getElementById('dir-outbound');
      const inBtn = document.getElementById('dir-inbound');

      dirContainer.classList.remove('hidden');

      if (currentRouteData.outbound.stops.length > 0) {
        document.getElementById('dest-outbound').innerText = currentRouteData.outbound.dest || '去程';
        outBtn.classList.remove('hidden');
      } else {
        outBtn.classList.add('hidden');
      }

      if (currentRouteData.inbound.stops.length > 0) {
        document.getElementById('dest-inbound').innerText = currentRouteData.inbound.dest || '回程';
        inBtn.classList.remove('hidden');
      } else {
        inBtn.classList.add('hidden');
      }

      currentDirection = currentRouteData.outbound.stops.length > 0 ? 'outbound' : 'inbound';
    }

    function switchDirection(dir) {
      currentDirection = dir;
      const outBtn = document.getElementById('dir-outbound');
      const inBtn = document.getElementById('dir-inbound');

      if (dir === 'outbound') {
        outBtn.className = "flex-1 py-1.5 rounded-md font-medium transition text-center bg-blue-600 text-white";
        inBtn.className = "flex-1 py-1.5 rounded-md font-medium transition text-center text-slate-400 hover:text-white";
      } else {
        inBtn.className = "flex-1 py-1.5 rounded-md font-medium transition text-center bg-blue-600 text-white";
        outBtn.className = "flex-1 py-1.5 rounded-md font-medium transition text-center text-slate-400 hover:text-white";
      }

      renderCurrentDirection();
    }

    function renderCurrentDirection() {
      const data = currentRouteData[currentDirection];
      const stopsList = document.getElementById('stops-list');
      const stopCount = document.getElementById('stop-count');
      
      document.getElementById('welcome-panel').classList.add('hidden');
      document.getElementById('stops-container').classList.remove('hidden');
      
      stopsList.innerHTML = '';
      stopCount.innerText = data.stops.length;

      markersLayer.clearLayers();
      polylineLayer.clearLayers();

      const polylinePoints = [];

      data.stops.forEach((stop, index) => {
        // 1. Add to sidebar list
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-2.5 hover:bg-slate-100 rounded-xl cursor-pointer text-xs border border-transparent hover:border-slate-200 transition group";
        item.innerHTML = `
          <div class="flex items-center gap-2.5 truncate">
            <span class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 font-bold flex items-center justify-center text-[10px] group-hover:bg-blue-600 group-hover:text-white transition">
              ${stop.seq}
            </span>
            <span class="font-medium text-slate-800 truncate">${stop.name_tc}</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-[10px] group-hover:text-blue-500"></i>
        `;
        item.addEventListener('click', () => {
          map.panTo([stop.lat, stop.lng]);
          openStopEtaModal(stop);
        });
        stopsList.appendChild(item);

        // 2. Add Marker on Map
        const color = COMPANY_COLORS[stop.company] || '#2563eb';
        const customIcon = L.divIcon({
          className: 'custom-map-pin',
          html: `<div class="marker-pin" style="background-color: ${color}"><i class="fa-solid fa-bus"></i></div>`,
          iconSize: [30, 42],
          iconAnchor: [15, 42]
        });

        const marker = L.marker([stop.lat, stop.lng], { icon: customIcon });
        marker.bindTooltip(`${stop.seq}. ${stop.name_tc}`, { direction: 'top', offset: [0, -35] });
        marker.on('click', () => openStopEtaModal(stop));
        markersLayer.addLayer(marker);

        polylinePoints.push([stop.lat, stop.lng]);
      });

      // 3. Draw Route Line
      if (polylinePoints.length > 0) {
        const line = L.polyline(polylinePoints, {
          color: COMPANY_COLORS[data.company] || '#2563eb',
          weight: 5,
          opacity: 0.8
        });
        polylineLayer.addLayer(line);
        map.fitBounds(line.getBounds(), { padding: [50, 50] });
      }
    }

    // --- STOP ALL-ROUTES REALTIME ETA ENGINE ---
    async function openStopEtaModal(stop) {
      selectedStop = stop;
      document.getElementById('eta-stop-name').innerText = stop.name_tc;
      document.getElementById('eta-stop-sub').innerText = `車站 ID: ${stop.stop_id} | ${stop.company}`;
      document.getElementById('eta-modal').classList.remove('hidden');

      fetchStopAllRoutesETA(stop);

      // Auto Refresh Every 30s
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => fetchStopAllRoutesETA(stop), 30000);
    }

    async function fetchStopAllRoutesETA(stop) {
      const container = document.getElementById('eta-list-container');
      container.innerHTML = `
        <div class="text-center py-6 text-slate-400 text-xs flex flex-col items-center gap-2">
          <i class="fa-solid fa-spinner fa-spin text-lg text-blue-500"></i>
          <span>正在聚合全站巴士實時到站數據...</span>
        </div>`;

      let etaItems = [];

      try {
        // Solution for KMB/LWB
        if (stop.company === 'KMB' || stop.company === 'LWB') {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stop.stop_id}`);
          const json = await res.json();
          if (json.data) {
            etaItems = json.data.map(item => ({
              co: item.co,
              route: item.route,
              dest: item.dest_tc,
              eta: item.eta,
              rmk: item.rmk_tc
            }));
          }
        } 
        // Solution for Citybus & Others (Data.gov.hk Batch ETA API endpoint)
        else if (stop.company === 'CTB') {
          // 1. Try government batch stop ETA API first
          try {
            const batchRes = await fetch(`https://rt.data.gov.hk/v1/transport/batch/stop-eta/ctb/${stop.stop_id}`);
            const batchJson = await batchRes.json();
            if (batchJson.data) {
              etaItems = batchJson.data.map(item => ({
                co: 'CTB',
                route: item.route,
                dest: item.dest_tc,
                eta: item.eta,
                rmk: item.rmk_tc
              }));
            }
          } catch {
            // 2. Fallback: If viewing current searched route, fetch specific route ETA directly
            if (currentRouteData) {
              const currentRoute = currentRouteData.route;
              const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stop.stop_id}/${currentRoute}`);
              const json = await res.json();
              if (json.data) {
                etaItems = json.data.map(item => ({
                  co: 'CTB',
                  route: item.dir === 'O' ? currentRouteData.outbound.dest : currentRouteData.inbound.dest,
                  dest: item.dest_tc,
                  eta: item.eta,
                  rmk: item.rmk_tc
                }));
              }
            }
          }
        }

        renderEtaResults(etaItems);

      } catch (err) {
        console.error("ETA Fetch error:", err);
        container.innerHTML = `<div class="text-center py-4 text-xs text-red-500">讀取實時到站時間失敗，請再試一次。</div>`;
      }
    }

    function renderEtaResults(etaList) {
      const container = document.getElementById('eta-list-container');
      container.innerHTML = '';

      // Filter valid ETAs
      const validEtas = etaList.filter(i => i.eta).sort((a, b) => new Date(a.eta) - new Date(b.eta));

      if (validEtas.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">現時未有即時班次預報資訊。</div>`;
        return;
      }

      // Group by Route
      const grouped = {};
      validEtas.forEach(item => {
        const key = `${item.route}-${item.dest}`;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(item);
      });

      Object.keys(grouped).forEach(key => {
        const items = grouped[key];
        const first = items[0];
        
        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded-xl border border-slate-100 shadow-sm space-y-2";
        
        let timesHtml = items.map(i => {
          const minutes = calculateMinutesLeft(i.eta);
          const badgeClass = minutes <= 3 ? "bg-red-500 text-white animate-pulse" : "bg-blue-50 text-blue-700 border border-blue-200";
          return `
            <div class="flex items-center justify-between text-xs py-1 border-b border-slate-50 last:border-0">
              <span class="text-slate-500">${i.rmk || '原定班次'}</span>
              <div class="flex items-center gap-2">
                <span class="font-mono font-bold px-2 py-0.5 rounded-md ${badgeClass}">
                  ${minutes <= 0 ? '即將到達' : minutes + ' 分鐘'}
                </span>
                <span class="text-[10px] text-slate-400">${formatTime(i.eta)}</span>
              </div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-xs font-bold text-white" style="background-color: ${COMPANY_COLORS[first.co] || '#2563eb'}">
                ${first.route}
              </span>
              <span class="text-xs font-bold text-slate-700">往 ${first.dest}</span>
            </div>
          </div>
          <div class="space-y-1">
            ${timesHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function calculateMinutesLeft(etaIsoStr) {
      if (!etaIsoStr) return 999;
      const etaTime = new Date(etaIsoStr).getTime();
      const now = new Date().getTime();
      return Math.floor((etaTime - now) / 60000);
    }

    function formatTime(etaIsoStr) {
      if (!etaIsoStr) return '';
      const date = new Date(etaIsoStr);
      return date.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function closeEtaModal() {
      document.getElementById('eta-modal').classList.add('hidden');
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    }

    function showLoadingStops() {
      document.getElementById('welcome-panel').classList.add('hidden');
      const container = document.getElementById('stops-container');
      container.classList.remove('hidden');
      document.getElementById('stops-list').innerHTML = `
        <div class="text-center py-10 text-xs text-slate-400 space-y-2">
          <i class="fa-solid fa-spinner fa-spin text-xl text-blue-500"></i>
          <p>正在從巴士公司 API 獲取路線與車站資料...</p>
        </div>`;
    }

    function resetRouteView() {
      markersLayer.clearLayers();
      polylineLayer.clearLayers();
      currentRouteData = null;
      document.getElementById('direction-container').classList.add('hidden');
      document.getElementById('stops-container').classList.add('hidden');
      document.getElementById('welcome-panel').classList.remove('hidden');
      closeEtaModal();
    }
  </script>
</body>
</html>
