<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港巴士全公司到站地圖 (Combined All-Stop ETA Map)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    #map { height: 100vh; width: 100vw; z-index: 1; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Custom Marker Pins */
    .marker-pin {
      width: 26px;
      height: 26px;
      border-radius: 50% 50% 50% 0;
      position: absolute;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      margin: -20px 0 0 -13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
    .marker-pin i {
      transform: rotate(45deg);
      color: white;
      font-size: 11px;
    }

    /* All-Stops Map Dot */
    .all-stop-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .dot-kmb { background-color: #dc2626; }
    .dot-ctb { background-color: #ca8a04; }
    .dot-combined { background-color: #2563eb; }
  </style>
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

  <!-- Map View -->
  <div id="map"></div>

  <!-- Left Control Panel -->
  <div class="fixed top-4 left-4 z-[1000] w-full max-w-sm px-2 sm:px-0">
    <div class="glass-panel rounded-2xl shadow-xl border border-white/50 overflow-hidden flex flex-col max-h-[calc(100vh-2rem)]">
      
      <!-- Top Header -->
      <div class="p-4 bg-slate-900 text-white flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-bus text-yellow-400 text-xl"></i>
            <h1 class="font-bold text-lg tracking-wide">香港巴士地圖</h1>
          </div>
          <span class="text-[10px] bg-blue-600/30 text-blue-300 border border-blue-500/40 px-2 py-0.5 rounded-full font-mono">九巴 + 城巴 聯合版</span>
        </div>

        <!-- All-Stops Layer Toggle Switch -->
        <div class="flex items-center justify-between bg-slate-800/90 px-3 py-2 rounded-xl border border-slate-700 text-xs">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-map-pin text-blue-400"></i>
            <span class="font-medium text-slate-200">顯示地圖範圍內所有巴士站</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="all-stops-toggle" class="sr-only peer">
            <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
          </label>
        </div>

        <!-- Search Input Bar -->
        <div class="relative flex-1">
          <input type="text" id="route-input" placeholder="搜尋路線 (例如 102, 1A, 968, B1)..." 
            class="w-full bg-slate-800 text-sm text-white placeholder-slate-400 rounded-lg pl-8 pr-8 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-3 text-slate-400 text-xs"></i>
          <button id="clear-search" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-white text-xs">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Dynamic Company & Direction Selection Dropdown -->
        <div id="route-options-container" class="hidden flex flex-col gap-1 text-xs">
          <label class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">選擇營辦商與方向：</label>
          <select id="route-variant-select" class="w-full bg-slate-800 text-white rounded-lg px-2.5 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </select>
        </div>
      </div>

      <!-- Route Stop List -->
      <div id="stops-container" class="flex-1 overflow-y-auto custom-scrollbar p-3 hidden space-y-1">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-2 py-1 flex justify-between items-center">
          <span>車站列表 (<span id="stop-count">0</span>)</span>
          <span class="text-[10px] text-slate-400">點擊車站即時查看 ETA</span>
        </div>
        <div id="stops-list" class="space-y-1"></div>
      </div>

      <!-- Initial Welcome State -->
      <div id="welcome-panel" class="p-6 text-center text-slate-500 space-y-3">
        <i class="fa-solid fa-map-location-dot text-4xl text-slate-300"></i>
        <p class="text-xs leading-relaxed">請在上方搜尋路線（可自由選擇九巴/城巴及方向），或開啟「顯示所有巴士站」查看全港車站實時抵站時間。</p>
      </div>
    </div>
  </div>

  <!-- Bottom Floating ETA Panel -->
  <div id="eta-modal" class="hidden fixed bottom-6 right-6 left-6 sm:left-auto sm:w-96 z-[1000] glass-panel rounded-2xl shadow-2xl border border-white/60 overflow-hidden flex flex-col transition-all duration-300">
    <div class="bg-slate-900 text-white p-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2 overflow-hidden">
        <i class="fa-solid fa-clock text-blue-400 shrink-0"></i>
        <div class="truncate">
          <h3 id="eta-stop-name" class="font-bold text-sm truncate">車站名稱</h3>
          <p id="eta-stop-sub" class="text-[10px] text-slate-400 truncate">實時抵站預報</p>
        </div>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="refresh-eta-btn" title="重新整理" class="p-1.5 text-slate-400 hover:text-white rounded-lg transition">
          <i class="fa-solid fa-rotate text-xs"></i>
        </button>
        <button id="close-eta-btn" class="p-1.5 text-slate-400 hover:text-white rounded-lg transition">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Live ETA Container -->
    <div id="eta-list-container" class="p-3 max-h-80 overflow-y-auto custom-scrollbar space-y-2">
      <div class="text-center py-6 text-slate-400 text-xs flex flex-col items-center gap-2">
        <i class="fa-solid fa-spinner fa-spin text-lg text-blue-500"></i>
        <span>獲取數據中...</span>
      </div>
    </div>
  </div>

  <script>
    // --- Application State ---
    let map;
    let routeMarkersLayer = L.layerGroup();
    let routePolylineLayer = L.layerGroup();
    let allStopsLayer = L.layerGroup();

    let combinedStopsDatabase = []; // Stores combined KMB + CTB stops
    let isAllStopsMode = false;
    let currentRouteVariants = []; // Holds found company/direction variants
    let selectedStop = null;
    let autoRefreshTimer = null;

    const COMPANY_COLORS = {
      KMB: '#dc2626',
      LWB: '#ea580c',
      CTB: '#ca8a04',
      COMBINED: '#2563eb'
    };

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupEventListeners();
      preloadAllStops();
    });

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 13);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      routeMarkersLayer.addTo(map);
      routePolylineLayer.addTo(map);
      allStopsLayer.addTo(map);

      // Re-render stops on map pan/zoom when All-Stops toggle is active
      map.on('moveend', () => {
        if (isAllStopsMode) renderVisibleStops();
      });
    }

    function setupEventListeners() {
      const routeInput = document.getElementById('route-input');
      const clearBtn = document.getElementById('clear-search');
      const allStopsToggle = document.getElementById('all-stops-toggle');
      const variantSelect = document.getElementById('route-variant-select');

      routeInput.addEventListener('keyup', (e) => {
        clearBtn.classList.toggle('hidden', !routeInput.value);
        if (e.key === 'Enter') handleSearch();
      });

      clearBtn.addEventListener('click', () => {
        routeInput.value = '';
        clearBtn.classList.add('hidden');
        resetRouteView();
      });

      variantSelect.addEventListener('change', (e) => {
        const index = parseInt(e.target.value);
        if (!isNaN(index) && currentRouteVariants[index]) {
          renderSelectedRouteVariant(currentRouteVariants[index]);
        }
      });

      allStopsToggle.addEventListener('change', (e) => {
        isAllStopsMode = e.target.checked;
        if (isAllStopsMode) {
          renderVisibleStops();
        } else {
          allStopsLayer.clearLayers();
        }
      });

      document.getElementById('close-eta-btn').addEventListener('click', closeEtaModal);
      document.getElementById('refresh-eta-btn').addEventListener('click', () => {
        if (selectedStop) fetchStopAllRoutesETA(selectedStop);
      });
    }

    // --- Preload & Combine KMB + Citybus Stops Data ---
    async function preloadAllStops() {
      try {
        const [kmbRes, ctbRes] = await Promise.all([
          fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop').then(r => r.json()).catch(() => ({ data: [] })),
          fetch('https://rt.data.gov.hk/v2/transport/citybus/stop/CTB').then(r => r.json()).catch(() => ({ data: [] }))
        ]);

        const kmbStops = (kmbRes.data || []).map(s => ({
          stop_id: s.stop,
          name_tc: s.name_tc,
          lat: parseFloat(s.lat),
          lng: parseFloat(s.long),
          companies: ['KMB'],
          kmb_id: s.stop,
          ctb_id: null
        }));

        const ctbStops = (ctbRes.data || []).map(s => ({
          stop_id: s.stop,
          name_tc: s.name_tc,
          lat: parseFloat(s.lat),
          lng: parseFloat(s.long),
          companies: ['CTB'],
          kmb_id: null,
          ctb_id: s.stop
        }));

        // Combine stops by geographic distance threshold (~30 meters)
        const combined = [...kmbStops];

        ctbStops.forEach(ctb => {
          if (!ctb.lat || !ctb.lng) return;
          
          let matched = combined.find(item => {
            const distance = getDistanceInMeters(item.lat, item.lng, ctb.lat, ctb.lng);
            return distance < 35 && item.name_tc === ctb.name_tc;
          });

          if (matched) {
            if (!matched.companies.includes('CTB')) matched.companies.push('CTB');
            matched.ctb_id = ctb.stop_id;
          } else {
            combined.push(ctb);
          }
        });

        combinedStopsDatabase = combined;
      } catch (e) {
        console.error("Error preloading all stops:", e);
      }
    }

    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function renderVisibleStops() {
      allStopsLayer.clearLayers();
      if (map.getZoom() < 13) return;

      const bounds = map.getBounds();
      const visibleStops = combinedStopsDatabase.filter(s => bounds.contains([s.lat, s.lng]));

      visibleStops.forEach(stop => {
        let dotClass = 'dot-kmb';
        if (stop.companies.length > 1) dotClass = 'dot-combined';
        else if (stop.companies.includes('CTB')) dotClass = 'dot-ctb';

        const dotIcon = L.divIcon({
          className: 'custom-stop-dot',
          html: `<div class="all-stop-dot ${dotClass}" title="${stop.name_tc}"></div>`,
          iconSize: [12, 12],
          iconAnchor: [6, 6]
        });

        const marker = L.marker([stop.lat, stop.lng], { icon: dotIcon });
        marker.bindTooltip(`${stop.name_tc} (${stop.companies.join('+')})`, { direction: 'top', offset: [0, -5] });
        marker.on('click', () => openStopEtaModal(stop));
        allStopsLayer.addLayer(marker);
      });
    }

    // --- Search & Multi-Company / Multi-Direction Logic ---
    async function handleSearch() {
      const route = document.getElementById('route-input').value.trim().toUpperCase();
      if (!route) return;

      resetRouteView();
      showLoadingStops();

      try {
        currentRouteVariants = await fetchAllRouteVariants(route);

        if (currentRouteVariants.length === 0) {
          alert(`未有找到路線 ${route} 的資料。`);
          resetRouteView();
          return;
        }

        populateVariantDropdown(currentRouteVariants);
        renderSelectedRouteVariant(currentRouteVariants[0]);

      } catch (err) {
        console.error("Search Error:", err);
        alert("搜尋失敗，請再試一次。");
        resetRouteView();
      }
    }

    // Search KMB and CTB simultaneously for all directions
    async function fetchAllRouteVariants(route) {
      const variants = [];

      const [kmbOut, kmbIn, ctbOut, ctbIn] = await Promise.all([
        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/outbound/1`).then(r => r.json()).catch(() => ({ data: [] })),
        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/inbound/1`).then(r => r.json()).catch(() => ({ data: [] })),
        fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/outbound`).then(r => r.json()).catch(() => ({ data: [] })),
        fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/inbound`).then(r => r.json()).catch(() => ({ data: [] }))
      ]);

      // KMB Outbound
      if (kmbOut.data && kmbOut.data.length > 0) {
        const routeInfo = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}/outbound/1`).then(r=>r.json()).catch(()=>({data:{}}));
        variants.push({
          company: 'KMB',
          dirText: `往 ${routeInfo.data?.dest_tc || '去程'}`,
          stopsRaw: kmbOut.data,
          dest: routeInfo.data?.dest_tc
        });
      }

      // KMB Inbound
      if (kmbIn.data && kmbIn.data.length > 0) {
        const routeInfo = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}/inbound/1`).then(r=>r.json()).catch(()=>({data:{}}));
        variants.push({
          company: 'KMB',
          dirText: `往 ${routeInfo.data?.dest_tc || '回程'}`,
          stopsRaw: kmbIn.data,
          dest: routeInfo.data?.dest_tc
        });
      }

      // Citybus Outbound & Inbound
      if (ctbOut.data && ctbOut.data.length > 0 || ctbIn.data && ctbIn.data.length > 0) {
        const ctbRouteInfo = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route/CTB/${route}`).then(r=>r.json()).catch(()=>({data:{}}));
        
        if (ctbOut.data && ctbOut.data.length > 0) {
          variants.push({
            company: 'CTB',
            dirText: `往 ${ctbRouteInfo.data?.dest_tc || '去程'}`,
            stopsRaw: ctbOut.data,
            dest: ctbRouteInfo.data?.dest_tc
          });
        }
        if (ctbIn.data && ctbIn.data.length > 0) {
          variants.push({
            company: 'CTB',
            dirText: `往 ${ctbRouteInfo.data?.orig_tc || '回程'}`,
            stopsRaw: ctbIn.data,
            dest: ctbRouteInfo.data?.orig_tc
          });
        }
      }

      return variants;
    }

    function populateVariantDropdown(variants) {
      const container = document.getElementById('route-options-container');
      const select = document.getElementById('route-variant-select');
      select.innerHTML = '';

      variants.forEach((v, i) => {
        const option = document.createElement('option');
        option.value = i;
        option.innerText = `[${v.company}] ${v.dirText}`;
        select.appendChild(option);
      });

      container.classList.remove('hidden');
    }

    async function renderSelectedRouteVariant(variant) {
      showLoadingStops();

      let processedStops = [];
      if (variant.company === 'KMB') {
        processedStops = await processKMBStops(variant.stopsRaw);
      } else if (variant.company === 'CTB') {
        processedStops = await processCTBStops(variant.stopsRaw);
      }

      const stopsList = document.getElementById('stops-list');
      const stopCount = document.getElementById('stop-count');
      
      document.getElementById('welcome-panel').classList.add('hidden');
      document.getElementById('stops-container').classList.remove('hidden');
      
      stopsList.innerHTML = '';
      stopCount.innerText = processedStops.length;

      routeMarkersLayer.clearLayers();
      routePolylineLayer.clearLayers();

      const polylinePoints = [];

      processedStops.forEach((stop) => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-2.5 hover:bg-slate-100 rounded-xl cursor-pointer text-xs border border-transparent hover:border-slate-200 transition group";
        item.innerHTML = `
          <div class="flex items-center gap-2.5 truncate">
            <span class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 font-bold flex items-center justify-center text-[10px] group-hover:bg-blue-600 group-hover:text-white transition">
              ${stop.seq}
            </span>
            <span class="font-medium text-slate-800 truncate">${stop.name_tc}</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-[10px] group-hover:text-blue-500"></i>
        `;
        item.addEventListener('click', () => {
          map.panTo([stop.lat, stop.lng]);
          openStopEtaModal(stop);
        });
        stopsList.appendChild(item);

        const color = COMPANY_COLORS[stop.company] || '#2563eb';
        const customIcon = L.divIcon({
          className: 'custom-map-pin',
          html: `<div class="marker-pin" style="background-color: ${color}"><i class="fa-solid fa-bus"></i></div>`,
          iconSize: [30, 42],
          iconAnchor: [15, 42]
        });

        const marker = L.marker([stop.lat, stop.lng], { icon: customIcon });
        marker.bindTooltip(`${stop.seq}. ${stop.name_tc}`, { direction: 'top', offset: [0, -35] });
        marker.on('click', () => openStopEtaModal(stop));
        routeMarkersLayer.addLayer(marker);

        polylinePoints.push([stop.lat, stop.lng]);
      });

      if (polylinePoints.length > 0) {
        const line = L.polyline(polylinePoints, {
          color: COMPANY_COLORS[variant.company] || '#2563eb',
          weight: 5,
          opacity: 0.8
        });
        routePolylineLayer.addLayer(line);
        map.fitBounds(line.getBounds(), { padding: [50, 50] });
      }
    }

    async function processKMBStops(stopList) {
      const details = await Promise.all(stopList.map(async (s) => {
        try {
          const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`).then(r => r.json());
          return {
            stop_id: s.stop,
            kmb_id: s.stop,
            seq: s.seq,
            name_tc: res.data.name_tc,
            lat: parseFloat(res.data.lat),
            lng: parseFloat(res.data.long),
            company: 'KMB',
            companies: ['KMB']
          };
        } catch { return null; }
      }));
      return details.filter(Boolean);
    }

    async function processCTBStops(stopList) {
      const details = await Promise.all(stopList.map(async (s) => {
        try {
          const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${s.stop}`).then(r => r.json());
          return {
            stop_id: s.stop,
            ctb_id: s.stop,
            seq: s.seq,
            name_tc: res.data.name_tc,
            lat: parseFloat(res.data.lat),
            lng: parseFloat(res.data.long),
            company: 'CTB',
            companies: ['CTB']
          };
        } catch { return null; }
      }));
      return details.filter(Boolean);
    }

    // --- ALL-COMPANY STOP ETA AGGREGATION ---
    async function openStopEtaModal(stop) {
      selectedStop = stop;
      document.getElementById('eta-stop-name').innerText = stop.name_tc;
      document.getElementById('eta-stop-sub').innerText = `營辦商: ${(stop.companies || [stop.company]).join(' + ')}`;
      document.getElementById('eta-modal').classList.remove('hidden');

      fetchStopAllRoutesETA(stop);

      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => fetchStopAllRoutesETA(stop), 30000);
    }

    async function fetchStopAllRoutesETA(stop) {
      const container = document.getElementById('eta-list-container');
      container.innerHTML = `
        <div class="text-center py-6 text-slate-400 text-xs flex flex-col items-center gap-2">
          <i class="fa-solid fa-spinner fa-spin text-lg text-blue-500"></i>
          <span>正在聚合全站巴士實時數據...</span>
        </div>`;

      let etaItems = [];

      try {
        const kmbId = stop.kmb_id || (stop.company === 'KMB' ? stop.stop_id : null);
        const ctbId = stop.ctb_id || (stop.company === 'CTB' ? stop.stop_id : null);

        const promises = [];

        // 1. Fetch KMB ETA if KMB station ID exists
        if (kmbId) {
          promises.push(
            fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${kmbId}`)
              .then(r => r.json())
              .then(json => (json.data || []).map(i => ({
                co: i.co || 'KMB',
                route: i.route,
                dest: i.dest_tc,
                eta: i.eta,
                rmk: i.rmk_tc
              })))
              .catch(() => [])
          );
        }

        // 2. Fetch CTB Batch ETA if Citybus station ID exists
        if (ctbId) {
          promises.push(
            fetch(`https://rt.data.gov.hk/v1/transport/batch/stop-eta/ctb/${ctbId}`)
              .then(r => r.json())
              .then(json => (json.data || []).map(i => ({
                co: 'CTB',
                route: i.route,
                dest: i.dest_tc,
                eta: i.eta,
                rmk: i.rmk_tc
              })))
              .catch(() => [])
          );
        }

        const results = await Promise.all(promises);
        results.forEach(arr => etaItems.push(...arr));

        renderEtaResults(etaItems);

      } catch (err) {
        console.error("ETA Fetch Error:", err);
        container.innerHTML = `<div class="text-center py-4 text-xs text-red-500">讀取實時數據失敗，請再試一次。</div>`;
      }
    }

    function renderEtaResults(etaList) {
      const container = document.getElementById('eta-list-container');
      container.innerHTML = '';

      const validEtas = etaList.filter(i => i.eta).sort((a, b) => new Date(a.eta) - new Date(b.eta));

      if (validEtas.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">目前沒有即時班次預報資訊。</div>`;
        return;
      }

      const grouped = {};
      validEtas.forEach(item => {
        const key = `${item.co}-${item.route}-${item.dest}`;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(item);
      });

      Object.keys(grouped).forEach(key => {
        const items = grouped[key];
        const first = items[0];
        
        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded-xl border border-slate-100 shadow-sm space-y-2";
        
        let timesHtml = items.map(i => {
          const minutes = calculateMinutesLeft(i.eta);
          const badgeClass = minutes <= 3 ? "bg-red-500 text-white animate-pulse" : "bg-blue-50 text-blue-700 border border-blue-200";
          return `
            <div class="flex items-center justify-between text-xs py-1 border-b border-slate-50 last:border-0">
              <span class="text-slate-500">${i.rmk || '原定班次'}</span>
              <div class="flex items-center gap-2">
                <span class="font-mono font-bold px-2 py-0.5 rounded-md ${badgeClass}">
                  ${minutes <= 0 ? '即將到達' : minutes + ' 分鐘'}
                </span>
                <span class="text-[10px] text-slate-400">${formatTime(i.eta)}</span>
              </div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-xs font-bold text-white" style="background-color: ${COMPANY_COLORS[first.co] || '#2563eb'}">
                ${first.co} ${first.route}
              </span>
              <span class="text-xs font-bold text-slate-700">往 ${first.dest}</span>
            </div>
          </div>
          <div class="space-y-1">${timesHtml}</div>
        `;

        container.appendChild(card);
      });
    }

    function calculateMinutesLeft(etaIsoStr) {
      if (!etaIsoStr) return 999;
      const etaTime = new Date(etaIsoStr).getTime();
      const now = new Date().getTime();
      return Math.floor((etaTime - now) / 60000);
    }

    function formatTime(etaIsoStr) {
      if (!etaIsoStr) return '';
      const date = new Date(etaIsoStr);
      return date.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function closeEtaModal() {
      document.getElementById('eta-modal').classList.add('hidden');
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    }

    function showLoadingStops() {
      document.getElementById('welcome-panel').classList.add('hidden');
      const container = document.getElementById('stops-container');
      container.classList.remove('hidden');
      document.getElementById('stops-list').innerHTML = `
        <div class="text-center py-10 text-xs text-slate-400 space-y-2">
          <i class="fa-solid fa-spinner fa-spin text-xl text-blue-500"></i>
          <p>正在加載路線車站數據...</p>
        </div>`;
    }

    function resetRouteView() {
      routeMarkersLayer.clearLayers();
      routePolylineLayer.clearLayers();
      currentRouteVariants = [];
      document.getElementById('route-options-container').classList.add('hidden');
      document.getElementById('stops-container').classList.add('hidden');
      document.getElementById('welcome-panel').classList.remove('hidden');
      closeEtaModal();
    }
  </script>
</body>
</html>
