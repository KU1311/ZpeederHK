<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>釜山旅遊地圖與店家清單</title>
    <!-- Leaflet 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PapaParse CSV 解析庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #f8f9fa; color: #333; overflow: hidden; }
        
        /* 側邊欄與篩選控制區 */
        .sidebar { display: flex; flex-direction: column; width: 100%; z-index: 2; background: #fff; }
        .controls { padding: 12px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); z-index: 3; }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .filter-group:last-child { margin-bottom: 0; }
        select, input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; flex: 1; min-width: 110px; outline: none; }
        
        /* 按鈕樣式 */
        .btn { padding: 8px 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; font-weight: 500; }
        .btn:active { background: #0056b3; }
        .btn-toggle { background: #6c757d; }
        .btn-toggle.active { background: #28a745; }

        /* 手機版預設：地圖滿版，列表可展開折疊 */
        #map { flex: 1; width: 100%; z-index: 1; }
        .list-container { display: none; max-height: 40vh; overflow-y: auto; padding: 12px; background: #f8f9fa; border-top: 1px solid #eee; -webkit-overflow-scrolling: touch; }
        .list-container.open { display: block; }

        /* 店家卡片樣式 */
        .card { background: white; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: transform 0.1s; cursor: pointer; }
        .card:active { transform: scale(0.99); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .card-title { font-size: 16px; font-weight: bold; color: #1a1a1a; }
        .tag { background: #e9ecef; color: #495057; font-size: 12px; padding: 2px 8px; border-radius: 12px; }
        .card-district { font-size: 13px; color: #6c757d; margin-bottom: 6px; }
        .card-remarks { font-size: 13px; color: #444; line-height: 1.4; margin-bottom: 8px; }
        .card-footer { font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
        .card-footer a { color: #007bff; text-decoration: none; font-weight: 500; }
        .card-footer a.gmap-btn { color: #28a745; font-weight: bold; }

        /* Popup 樣式 */
        .popup-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        .popup-category { font-size: 12px; color: #007bff; font-weight: bold; margin-bottom: 4px; }
        .popup-remarks { font-size: 12px; color: #555; margin-bottom: 8px; }
        .popup-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; font-size: 12px; }
        .popup-actions a { text-decoration: none; font-weight: 500; }
        .popup-actions a.gmap-link { color: #28a745; font-weight: bold; }
        .popup-actions a.ig-link { color: #007bff; }

        /* 電腦/平板雙欄 Layout */
        @media (min-width: 768px) {
            body { flex-direction: row; }
            #map { height: 100vh; flex: 1; }
            .sidebar { width: 420px; height: 100vh; box-shadow: 2px 0 8px rgba(0,0,0,0.1); }
            .list-container { display: block !important; max-height: none; flex: 1; border-top: none; }
            .btn-toggle { display: none; } /* 電腦版隱藏切換按鈕 */
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <!-- 控制與篩選面板 -->
        <div class="controls">
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="搜尋店名、區域..." oninput="filterAndRender()">
                <select id="categoryFilter" onchange="filterAndRender()">
                    <option value="ALL">全部分類</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="districtFilter" onchange="filterAndRender()">
                    <option value="ALL">全部區域</option>
                </select>
                <select id="sortSelect" onchange="filterAndRender()">
                    <option value="DEFAULT">預設排序</option>
                    <option value="NAME">名稱排序</option>
                    <option value="DIST">距離 (近到遠)</option>
                </select>
            </div>
            <div class="filter-group">
                <button class="btn" onclick="locateUser()">📍 我的位置</button>
                <!-- 手機版開關清單按鈕 (Default 收起) -->
                <button id="toggleListBtn" class="btn btn-toggle" onclick="toggleShopList()">📋 顯示清單</button>
            </div>
        </div>

        <!-- 店家清單列表 (預設隱藏) -->
        <div class="list-container" id="shopList"></div>
    </div>

    <!-- 地圖面板 (預設滿版) -->
    <div id="map"></div>

<script>
    const CSV_URL = './busan_locations_direct_gmap.csv';

    let map;
    let markersLayer = L.layerGroup();
    let userMarker = null;
    let allData = [];
    let userCoords = null;

    // 初始化地圖：Default OpenStreetMap (OSM)
    function initMap() {
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        });

        const esriImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        });

        const cartoPositron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© CARTO'
        });

        map = L.map('map', {
            center: [35.1795, 129.0756],
            zoom: 11,
            layers: [osm]
        });

        const baseMaps = {
            "OpenStreetMap (預設)": osm,
            "Esri 街道圖": esriStreet,
            "Esri 衛星圖": esriImagery,
            "Carto 白底圖": cartoPositron
        };

        L.control.layers(baseMaps).addTo(map);
        markersLayer.addTo(map);
    }

    // 切換手機版清單展開/折疊
    function toggleShopList() {
        const listContainer = document.getElementById('shopList');
        const toggleBtn = document.getElementById('toggleListBtn');
        
        listContainer.classList.toggle('open');
        
        if (listContainer.classList.contains('open')) {
            toggleBtn.textContent = '✕ 折疊清單';
            toggleBtn.classList.add('active');
        } else {
            toggleBtn.textContent = '📋 顯示清單';
            toggleBtn.classList.remove('active');
        }

        setTimeout(() => map.invalidateSize(), 200);
    }

    // 解析 CSV
    function loadCSV() {
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                allData = results.data.filter(item => item['Shop name'] && item['lat'] && item['long']);
                populateFilters();
                filterAndRender();
            },
            error: function(err) {
                console.error("CSV 讀取失敗:", err);
                alert("無法載入 CSV 資料，請確認檔案路徑。");
            }
        });
    }

    // 動態建置選單並計算每個分類/區域的數量
    function populateFilters() {
        const catCounts = {};
        const distCounts = {};

        allData.forEach(item => {
            const cat = item.category ? item.category.trim() : '未分類';
            const dist = item.district ? item.district.trim() : '未分類';

            catCounts[cat] = (catCounts[cat] || 0) + 1;
            distCounts[dist] = (distCounts[dist] || 0) + 1;
        });

        // 1. 填寫分類下拉選單 (含 Count)
        const catSelect = document.getElementById('categoryFilter');
        catSelect.innerHTML = `<option value="ALL">全部分類 (${allData.length})</option>`;
        Object.keys(catCounts).forEach(cat => {
            catSelect.innerHTML += `<option value="${cat}">${cat} (${catCounts[cat]})</option>`;
        });

        // 2. 填寫區域下拉選單 (含 Count)
        const distSelect = document.getElementById('districtFilter');
        distSelect.innerHTML = `<option value="ALL">全部區域 (${allData.length})</option>`;
        Object.keys(distCounts).forEach(dist => {
            distSelect.innerHTML += `<option value="${dist}">${dist} (${distCounts[dist]})</option>`;
        });
    }

    // 計算距離
    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // 篩選與渲染
    function filterAndRender() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const selectedCat = document.getElementById('categoryFilter').value;
        const selectedDist = document.getElementById('districtFilter').value;
        const sortBy = document.getElementById('sortSelect').value;

        let filtered = allData.filter(item => {
            const matchesSearch = (item['Shop name'] || '').toLowerCase().includes(searchText) ||
                                  (item['remarks'] || '').toLowerCase().includes(searchText) ||
                                  (item['district'] || '').toLowerCase().includes(searchText);
            const matchesCat = selectedCat === 'ALL' || item.category === selectedCat;
            const matchesDist = selectedDist === 'ALL' || item.district === selectedDist;

            return matchesSearch && matchesCat && matchesDist;
        });

        if (sortBy === 'NAME') {
            filtered.sort((a, b) => a['Shop name'].localeCompare(b['Shop name'], 'zh-Hant'));
        } else if (sortBy === 'DIST' && userCoords) {
            filtered.forEach(item => {
                item._dist = getDistance(userCoords.lat, userCoords.lng, parseFloat(item.lat), parseFloat(item.long));
            });
            filtered.sort((a, b) => a._dist - b._dist);
        }

        renderMapAndList(filtered);
    }

    // 繪製地圖與卡片
    function renderMapAndList(data) {
        markersLayer.clearLayers();
        const listContainer = document.getElementById('shopList');
        listContainer.innerHTML = '';

        const bounds = [];

        data.forEach(item => {
            const lat = parseFloat(item.lat);
            const lng = parseFloat(item.long);
            if (isNaN(lat) || isNaN(lng)) return;

            bounds.push([lat, lng]);

            const gmapUrl = item['Google Maps Link'] || `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
            const links = (item['recommended by'] || '').split('\n').filter(l => l.trim() !== '');
            let igLinksHTML = links.map(link => `<a href="${link.trim()}" class="ig-link" target="_blank" rel="noopener">📍 IG 推薦貼文</a>`).join('<br>');

            const popupContent = `
                <div class="popup-title">${item['Shop name']}</div>
                <div class="popup-category">${item.category || ''} | ${item.district || ''}</div>
                <div class="popup-remarks">${item.remarks || ''}</div>
                <div class="popup-actions">
                    <a href="${gmapUrl}" class="gmap-link" target="_blank" rel="noopener">🗺️ 開啟 Google Maps</a>
                    ${igLinksHTML}
                </div>
            `;

            const marker = L.marker([lat, lng]).bindPopup(popupContent);
            markersLayer.addLayer(marker);

            const card = document.createElement('div');
            card.className = 'card';
            let distDisplay = item._dist ? `<span style="color:#28a745; font-weight:bold;"> (${item._dist.toFixed(1)} km)</span>` : '';

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${item['Shop name']}${distDisplay}</div>
                    <span class="tag">${item.category || '未分類'}</span>
                </div>
                <div class="card-district">📍 ${item.city || ''} ${item.district || ''}</div>
                <div class="card-remarks">${item.remarks || ''}</div>
                <div class="card-footer">
                    <a href="${gmapUrl}" class="gmap-btn" target="_blank" rel="noopener">🗺️ Google 地圖</a>
                    ${igLinksHTML}
                </div>
            `;

            card.onclick = (e) => {
                if (e.target.tagName !== 'A') {
                    map.setView([lat, lng], 16);
                    marker.openPopup();
                }
            };

            listContainer.appendChild(card);
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [30, 30] });
        }
    }

    // 使用者定位
    function locateUser() {
        if (!navigator.geolocation) {
            alert('您的瀏覽器不支援定位功能');
            return;
        }

        navigator.geolocation.getCurrentPosition(position => {
            const { latitude, longitude } = position.coords;
            userCoords = { lat: latitude, lng: longitude };

            if (userMarker) map.removeLayer(userMarker);

            userMarker = L.circleMarker([latitude, longitude], {
                radius: 8,
                fillColor: '#007bff',
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup('<b>你的目前位置</b>').openPopup();

            map.setView([latitude, longitude], 13);
            document.getElementById('sortSelect').value = 'DIST';
            filterAndRender();

        }, err => {
            alert('無法取得您的位置：' + err.message);
        });
    }

    window.onload = () => {
        initMap();
        loadCSV();
    };
</script>

</body>
</html>
