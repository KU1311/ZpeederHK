<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>釜山旅遊地圖與店家清單</title>
    <!-- Leaflet 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PapaParse CSV 解析庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #f8f9fa; color: #333; overflow: hidden; }
        
        /* 側邊欄與篩選控制區 */
        .sidebar { display: flex; flex-direction: column; width: 100%; z-index: 2; background: #fff; }
        .controls { padding: 12px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); z-index: 3; }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .filter-group:last-child { margin-bottom: 0; }
        select, input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; flex: 1; min-width: 105px; outline: none; }
        
        /* 按鈕樣式 */
        .btn { padding: 8px 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; font-weight: 500; }
        .btn:active { background: #0056b3; }
        .btn-toggle { background: #6c757d; }
        .btn-toggle.active { background: #28a745; }

        /* 手機版預設：地圖滿版，列表可展開折疊 */
        #map { flex: 1; width: 100%; z-index: 1; }
        .list-container { display: none; max-height: 40vh; overflow-y: auto; padding: 12px; background: #f8f9fa; border-top: 1px solid #eee; -webkit-overflow-scrolling: touch; }
        .list-container.open { display: block; }

        /* 店家卡片樣式 */
        .card { background: white; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: transform 0.1s; cursor: pointer; }
        .card:active { transform: scale(0.99); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .card-title { font-size: 15px; font-weight: bold; color: #1a1a1a; }
        .tag { background: #e9ecef; color: #495057; font-size: 12px; padding: 2px 8px; border-radius: 12px; margin-left: 4px; }
        .tag-day { background: #e3f2fd; color: #0d47a1; }
        .card-district { font-size: 13px; color: #6c757d; margin-bottom: 6px; }
        .card-remarks { font-size: 13px; color: #444; line-height: 1.4; margin-bottom: 8px; }
        .card-footer { font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
        .card-footer a { color: #007bff; text-decoration: none; font-weight: 500; }
        .card-footer a.gmap-btn { color: #28a745; font-weight: bold; }

        /* Popup 樣式 */
        .popup-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        .popup-category { font-size: 12px; color: #007bff; font-weight: bold; margin-bottom: 4px; }
        .popup-remarks { font-size: 12px; color: #555; margin-bottom: 8px; }
        .popup-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; font-size: 12px; }
        .popup-actions a { text-decoration: none; font-weight: 500; }
        .popup-actions a.gmap-link { color: #28a745; font-weight: bold; }
        .popup-actions a.ig-link { color: #007bff; }

        /* 地圖色彩圖例 Legend */
        .legend-control { background: rgba(255, 255, 255, 0.95); padding: 8px 12px; border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,0.2); font-size: 12px; max-height: 160px; overflow-y: auto; }
        .legend-title { font-weight: bold; margin-bottom: 6px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; display: inline-block; border: 1px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.5); }

        /* SVG 定制 Marker */
        .custom-pin { display: flex; align-items: center; justify-content: center; }

        /* 電腦/平板雙欄 Layout */
        @media (min-width: 768px) {
            body { flex-direction: row; }
            #map { height: 100vh; flex: 1; }
            .sidebar { width: 420px; height: 100vh; box-shadow: 2px 0 8px rgba(0,0,0,0.1); }
            .list-container { display: block !important; max-height: none; flex: 1; border-top: none; }
            .btn-toggle { display: none; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <!-- 控制與篩選面板 -->
        <div class="controls">
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="搜尋店名、關鍵字..." oninput="filterAndRender()">
                <select id="colorModeSelect" onchange="updateColorPaletteAndRender()">
                    <option value="CATEGORY">🎨 顏色依據：類別</option>
                    <option value="DAY">📅 顏色依據：建議天數</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="categoryFilter" onchange="filterAndRender()">
                    <option value="ALL">全部分類</option>
                </select>
                <select id="dayFilter" onchange="filterAndRender()">
                    <option value="ALL">全部天數</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="districtFilter" onchange="filterAndRender()">
                    <option value="ALL">全部區域</option>
                </select>
                <select id="sortSelect" onchange="filterAndRender()">
                    <option value="DEFAULT">預設排序</option>
                    <option value="NAME">名稱排序</option>
                    <option value="DIST">距離 (近到遠)</option>
                </select>
            </div>
            <div class="filter-group">
                <button class="btn" onclick="locateUser()">📍 我的位置</button>
                <button id="toggleListBtn" class="btn btn-toggle" onclick="toggleShopList()">📋 顯示清單</button>
            </div>
        </div>

        <!-- 店家清單列表 -->
        <div class="list-container" id="shopList"></div>
    </div>

    <!-- 地圖面板 -->
    <div id="map"></div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUD2hl2ESuxvAOGP9vEJNtSCO_sfAxvEFfbnPOYJnsDc4OylmzXlf3YGgRaHeFORjcpcSToFDhrhU5/pub?gid=1776966969&single=true&output=csv';

    let map;
    let markersLayer = L.layerGroup();
    let legendControl = L.control({ position: 'bottomright' });
    let userMarker = null;
    let allData = [];
    let userCoords = null;

    const PALETTE = [
        '#E63946', '#2A9D8F', '#E76F51', '#457B9D', '#9C27B0', 
        '#FF9800', '#00BCD4', '#8BC34A', '#673AB7', '#795548', 
        '#3F51B5', '#E91E63'
    ];
    let colorMapping = {};

    // 輔助函式：取得正規化的建議天數名稱
    function getNormalizedDay(item) {
        const dayVal = item['Suggested day'];
        return (dayVal && dayVal.trim() !== '') ? dayVal.trim() : '未指定';
    }

    // 輔助函式：取得正規化的類別名稱
    function getNormalizedCategory(item) {
        const catVal = item.category;
        return (catVal && catVal.trim() !== '') ? catVal.trim() : '未分類';
    }

    // 輔助函式：取得正規化的區域名稱
    function getNormalizedDistrict(item) {
        const distVal = item.district;
        return (distVal && distVal.trim() !== '') ? distVal.trim() : '未分類';
    }

    function initMap() {
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        });

        map = L.map('map', {
            center: [35.1795, 129.0756],
            zoom: 11,
            layers: [osm]
        });

        const baseMaps = {
            "OpenStreetMap (預設)": osm,
            "Esri 街道圖": esriStreet
        };

        L.control.layers(baseMaps).addTo(map);
        markersLayer.addTo(map);

        legendControl.onAdd = function() {
            const div = L.DomUtil.create('div', 'legend-control');
            return div;
        };
        legendControl.addTo(map);
    }

    function toggleShopList() {
        const listContainer = document.getElementById('shopList');
        const toggleBtn = document.getElementById('toggleListBtn');
        listContainer.classList.toggle('open');
        
        if (listContainer.classList.contains('open')) {
            toggleBtn.textContent = '✕ 折疊清單';
            toggleBtn.classList.add('active');
        } else {
            toggleBtn.textContent = '📋 顯示清單';
            toggleBtn.classList.remove('active');
        }
        setTimeout(() => map.invalidateSize(), 200);
    }

    function loadCSV() {
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                allData = results.data.filter(item => item['Shop name'] && item['lat'] && item['long']);
                populateFilters();
                updateColorPaletteAndRender();
            },
            error: function(err) {
                console.error("CSV 載入失敗:", err);
                alert("無法載入資料，請確認網路與網址權限。");
            }
        });
    }

    function populateFilters() {
        const catCounts = {};
        const distCounts = {};
        const dayCounts = {};

        allData.forEach(item => {
            const cat = getNormalizedCategory(item);
            const dist = getNormalizedDistrict(item);
            const day = getNormalizedDay(item);

            catCounts[cat] = (catCounts[cat] || 0) + 1;
            distCounts[dist] = (distCounts[dist] || 0) + 1;
            dayCounts[day] = (dayCounts[day] || 0) + 1;
        });

        // 1. 分類
        const catSelect = document.getElementById('categoryFilter');
        catSelect.innerHTML = `<option value="ALL">全部分類 (${allData.length})</option>`;
        Object.keys(catCounts).forEach(cat => {
            catSelect.innerHTML += `<option value="${cat}">${cat} (${catCounts[cat]})</option>`;
        });

        // 2. 建議天數 (修正「未指定」比對)
        const daySelect = document.getElementById('dayFilter');
        daySelect.innerHTML = `<option value="ALL">全部天數 (${allData.length})</option>`;
        Object.keys(dayCounts).sort().forEach(day => {
            daySelect.innerHTML += `<option value="${day}">${day} (${dayCounts[day]})</option>`;
        });

        // 3. 區域
        const distSelect = document.getElementById('districtFilter');
        distSelect.innerHTML = `<option value="ALL">全部區域 (${allData.length})</option>`;
        Object.keys(distCounts).forEach(dist => {
            distSelect.innerHTML += `<option value="${dist}">${dist} (${distCounts[dist]})</option>`;
        });
    }

    function updateColorPaletteAndRender() {
        const mode = document.getElementById('colorModeSelect').value;
        const keys = new Set();

        allData.forEach(item => {
            if (mode === 'CATEGORY') {
                keys.add(getNormalizedCategory(item));
            } else {
                keys.add(getNormalizedDay(item));
            }
        });

        colorMapping = {};
        const sortedKeys = Array.from(keys).sort();
        sortedKeys.forEach((key, index) => {
            colorMapping[key] = PALETTE[index % PALETTE.length];
        });

        // 更新圖例 (Legend)
        const legendDiv = document.querySelector('.legend-control');
        let legendHTML = `<div class="legend-title">${mode === 'CATEGORY' ? '類別圖例' : '天數圖例'}</div>`;
        sortedKeys.forEach(key => {
            legendHTML += `
                <div class="legend-item">
                    <span class="legend-color" style="background:${colorMapping[key]}"></span>
                    <span>${key}</span>
                </div>
            `;
        });
        legendDiv.innerHTML = legendHTML;

        filterAndRender();
    }

    function createColoredMarkerIcon(color) {
        const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="26" height="38">
                <path d="M12 0C5.373 0 0 5.373 0 12c0 9 12 24 12 24s12-15 12-24c0-6.627-5.373-12-12-12z" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="4.5" fill="#ffffff"/>
            </svg>`;
        return L.divIcon({
            className: 'custom-pin',
            html: svg,
            iconSize: [26, 38],
            iconAnchor: [13, 38],
            popupAnchor: [0, -34]
        });
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function filterAndRender() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const selectedCat = document.getElementById('categoryFilter').value;
        const selectedDay = document.getElementById('dayFilter').value;
        const selectedDist = document.getElementById('districtFilter').value;
        const sortBy = document.getElementById('sortSelect').value;

        let filtered = allData.filter(item => {
            const matchesSearch = (item['Shop name'] || '').toLowerCase().includes(searchText) ||
                                  (item['remarks'] || '').toLowerCase().includes(searchText) ||
                                  (item['district'] || '').toLowerCase().includes(searchText);

            const itemCat = getNormalizedCategory(item);
            const itemDay = getNormalizedDay(item);
            const itemDist = getNormalizedDistrict(item);

            const matchesCat = selectedCat === 'ALL' || itemCat === selectedCat;
            const matchesDay = selectedDay === 'ALL' || itemDay === selectedDay;
            const matchesDist = selectedDist === 'ALL' || itemDist === selectedDist;

            return matchesSearch && matchesCat && matchesDay && matchesDist;
        });

        if (sortBy === 'NAME') {
            filtered.sort((a, b) => a['Shop name'].localeCompare(b['Shop name'], 'zh-Hant'));
        } else if (sortBy === 'DIST' && userCoords) {
            filtered.forEach(item => {
                item._dist = getDistance(userCoords.lat, userCoords.lng, parseFloat(item.lat), parseFloat(item.long));
            });
            filtered.sort((a, b) => a._dist - b._dist);
        }

        renderMapAndList(filtered);
    }

    function renderMapAndList(data) {
        markersLayer.clearLayers();
        const listContainer = document.getElementById('shopList');
        listContainer.innerHTML = '';

        const bounds = [];
        const mode = document.getElementById('colorModeSelect').value;

        data.forEach(item => {
            const lat = parseFloat(item.lat);
            const lng = parseFloat(item.long);
            if (isNaN(lat) || isNaN(lng)) return;

            bounds.push([lat, lng]);

            const itemCat = getNormalizedCategory(item);
            const itemDay = getNormalizedDay(item);

            const key = mode === 'CATEGORY' ? itemCat : itemDay;
            const color = colorMapping[key] || '#007bff';

            const gmapUrl = item['Google Maps Link'] || `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
            const links = (item['recommended by'] || '').split('\n').filter(l => l.trim() !== '');
            let igLinksHTML = links.map(link => `<a href="${link.trim()}" class="ig-link" target="_blank" rel="noopener">📍 IG 推薦貼文</a>`).join('<br>');

            const popupContent = `
                <div class="popup-title">${item['Shop name']}</div>
                <div class="popup-category">${itemCat} | ${itemDay}</div>
                <div class="popup-remarks">${item.remarks || ''}</div>
                <div class="popup-actions">
                    <a href="${gmapUrl}" class="gmap-link" target="_blank" rel="noopener">🗺️ 開啟 Google Maps</a>
                    ${igLinksHTML}
                </div>
            `;

            const icon = createColoredMarkerIcon(color);
            const marker = L.marker([lat, lng], { icon }).bindPopup(popupContent);
            markersLayer.addLayer(marker);

            const card = document.createElement('div');
            card.className = 'card';
            let distDisplay = item._dist ? `<span style="color:#28a745; font-weight:bold;"> (${item._dist.toFixed(1)} km)</span>` : '';
            let dayTag = itemDay !== '未指定' ? `<span class="tag tag-day">${itemDay}</span>` : '';

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${item['Shop name']}${distDisplay}</div>
                    <div>
                        <span class="tag" style="border-left: 4px solid ${color};">${itemCat}</span>
                        ${dayTag}
                    </div>
                </div>
                <div class="card-district">📍 ${item.city || ''} ${item.district || ''}</div>
                <div class="card-remarks">${item.remarks || ''}</div>
                <div class="card-footer">
                    <a href="${gmapUrl}" class="gmap-btn" target="_blank" rel="noopener">🗺️ Google 地圖</a>
                    ${igLinksHTML}
                </div>
            `;

            card.onclick = (e) => {
                if (e.target.tagName !== 'A') {
                    map.setView([lat, lng], 16);
                    marker.openPopup();
                }
            };

            listContainer.appendChild(card);
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [30, 30] });
        }
    }

    function locateUser() {
        if (!navigator.geolocation) {
            alert('您的瀏覽器不支援定位功能');
            return;
        }

        navigator.geolocation.getCurrentPosition(position => {
            const { latitude, longitude } = position.coords;
            userCoords = { lat: latitude, lng: longitude };

            if (userMarker) map.removeLayer(userMarker);

            userMarker = L.circleMarker([latitude, longitude], {
                radius: 8,
                fillColor: '#007bff',
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup('<b>你的目前位置</b>').openPopup();

            map.setView([latitude, longitude], 13);
            document.getElementById('sortSelect').value = 'DIST';
            filterAndRender();

        }, err => {
            alert('無法取得您的位置：' + err.message);
        });
    }

    window.onload = () => {
        initMap();
        loadCSV();
    };
</script>

</body>
</html>
